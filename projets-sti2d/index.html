      <div class="aide">Concours Course en Cours — saison ${CEC.saison}</div>
      <div class="theme">Thème : « ${esc(CEC.theme)} »</div>
      <p class="aide" style="margin:.3rem 0 0">D'après le règlement officiel ${CEC.saison}. Le Centre de Ressources de l'académie peut imposer des contraintes plus strictes : vérifiez auprès de lui.</p></div>
      ${sec ? '' : `<button class="btn secondaire" id="btn-imp-cec">🖨️ Imprimer la fiche Course en Cours</button>`}</div></div>`;
  const tableEpreuves = (avecAuto) => `<table class="cec-tab"><thead><tr><th>Épreuve</th><th>Critère (noté sur 20)</th>${avecAuto ? '<th>Où en êtes-vous ?</th>' : ''}</tr></thead><tbody>
    ${CEC.epreuves.map(ep => ep.criteres.map(([k, l], i) => `<tr>${i === 0 ? `<td rowspan="${ep.criteres.length}"><b>${esc(ep.nom)}</b><br><span class="aide">${esc(ep.info)}</span></td>` : ''}<td>${esc(l)}</td>
      ${avecAuto ? `<td><select data-auto="${k}">${[['', '—'], ['bas', 'Bas (1 à 7)'], ['moyen', 'Moyen (8 à 13)'], ['haut', 'Haut (14 à 20)']].map(([v, t]) => `<option value="${v}"${C.auto[k] === v ? ' selected' : ''}>${t}</option>`).join('')}</select></td>` : ''}</tr>`).join('')).join('')}
    </tbody></table>
    <p class="aide">Barème des épreuves classées (course, temps de réaction, conception collaborative) : ${CEC.bareme.map(([pl, pts]) => `${pl} = ${pts} pts`).join(' · ')}.</p>
    <p class="aide"><b>Prix :</b> ${CEC.prix.join(' · ')} (1 prix au maximum par équipe ; un véhicule non conforme ne peut prétendre à aucun prix).<br><b>Trophées :</b> ${CEC.trophees.join(' · ')}.</p>`;

  if (sec) {
    // ---------- Seconde : découverte du vrai concours ----------
    c.innerHTML = `<p class="intro">Votre projet est une <b>mini version</b> de Course en Cours, avec son propre règlement (onglet « Fiche projet »).
      Cet onglet présente le <b>vrai concours</b>, que font les élèves de Première STI2D.</p>${intro}
      <div class="carte"><h2>Le vrai concours et notre mini version</h2>
      <table class="cec-tab"><thead><tr><th></th><th>Course en Cours ${CEC.saison}</th><th>Notre mini version</th></tr></thead><tbody>
        <tr><td><b>Équipe</b></td><td>4 à 6 élèves, des rôles précis</td><td>4 à 6 élèves</td></tr>
        <tr><td><b>Voiture</b></td><td>350 × 125 × 150 mm maximum, au moins 3 roues, garde au sol ≥ 1 mm</td><td>${SECONDE.voitureMax} mm maximum dans chaque direction</td></tr>
        <tr><td><b>Moteur</b></td><td>Bloc moteur électrique radiocommandé fourni (rapport 1 : 3), non modifiable</td><td>Moteur fourni par le professeur, le même pour tous</td></tr>
        <tr><td><b>Sécurité</b></td><td>Au moins 2 attaches pour le fil de guidage</td><td>Guidage sur la piste</td></tr>
        <tr><td><b>Stand</b></td><td>2 m × 1,50 m × 2 m maximum</td><td>Socle de ${SECONDE.standMax} × ${SECONDE.standMax} mm, hauteur libre</td></tr>
        <tr><td><b>Course</b></td><td>Piste de 20 m maximum, temps de réaction, arrêt au stand, KO</td><td>Course de fin d'année</td></tr>
        <tr><td><b>Budget</b></td><td>2 000 € maximum, sponsors</td><td>Pas de sponsors</td></tr>
      </tbody></table></div>
      <div class="carte"><h2>Les épreuves du vrai concours</h2>${tableEpreuves(false)}</div>`;
    return;
  }

  // ---------- Première / Terminale : tableau de bord complet ----------
  const mesureHtml = d => { const e = etatMesure(d, C.mesures[d.k]); return `<div class="mesure"><label for="m-${d.k}">${esc(d.label)}</label><span class="limite">${esc(limiteTexte(d))}</span>
    <div class="saisie"><input type="number" id="m-${d.k}" data-mesure="${d.k}" value="${esc(C.mesures[d.k] ?? '')}" step="any" min="0" inputmode="decimal"><span>${esc(d.unite)}</span></div>
    <div class="statut ${e.etat}" data-statut="${d.k}">${e.txt}</div></div>`; };
  const cochesHtml = l => `<div class="coches">${l.map(([k, t]) => `<label class="${C.coches[k] ? 'fait' : ''}"><input type="checkbox" data-coche="${k}"${C.coches[k] ? ' checked' : ''}><span>${esc(t)}</span></label>`).join('')}</div>`;
  const n = projet.eleves.length;
  c.innerHTML = `${intro}
    <div class="carte"><h2>Notre équipe et le thème</h2>
      <div class="ligne-champs"><div class="champ"><label for="cec-equipe">Nom de l'équipe (en lien avec le thème)</label><input type="text" id="cec-equipe" data-cec="equipe" value="${esc(C.equipe)}" placeholder="Ex. : Les Dragons de Brocéliande"></div></div>
      <div class="champ"><label for="cec-lien">Comment notre véhicule s'inspire-t-il du thème « ${esc(CEC.theme)} » ?</label><textarea id="cec-lien" data-cec="lienTheme" rows="2">${esc(C.lienTheme)}</textarea></div>
      ${n < 4 || n > 6 ? `<div class="alerte warn">L'équipe compte ${n} élève${n > 1 ? 's' : ''} : le règlement impose 4 à 6 membres (onglet « Équipe et tâches »).</div>` : `<p class="aide">✓ ${n} membres (4 à 6 exigés).</p>`}
      ${cochesHtml(CEC.equipe)}
      <h3>Les rôles</h3><p class="aide">Chaque membre doit avoir au moins un rôle ; un élève peut en cumuler plusieurs. Touchez les prénoms.</p>
      <div class="roles">${CEC.roles.map(([k, t, d]) => `<div class="role"><b>${esc(t)}</b><span class="aide">${esc(d)}</span><div class="puces">
        ${projet.eleves.length ? projet.eleves.map(e => `<button type="button" class="puce${(C.roles[k] || []).includes(e.uid) ? ' on' : ''}" data-role="${k}" data-v="${e.uid}">${esc(nomResponsable(e.uid))}</button>`).join('') : '<span class="aide">Ajoutez les élèves dans l’onglet « Équipe et tâches ».</span>'}
      </div></div>`).join('')}</div>
      <div id="sans-role"></div></div>

    <div class="carte"><h2>Contrôle technique du véhicule</h2>
      <p class="aide">Pour être conforme, le véhicule doit respecter <b>tous</b> les critères (annexe 2 du règlement). Mesurez-le monté, avec son système de propulsion.</p>
      <div class="resume" id="resume-vehicule"></div>
      <div class="mesures">${CEC.mesures.map(mesureHtml).join('')}</div>
      <p class="aide">Masse du véhicule : libre.</p>
      ${cochesHtml(CEC.vehicule)}</div>

    <div class="carte"><h2>Le stand</h2><div class="resume" id="resume-stand"></div>
      <div class="mesures">${CEC.stand.map(mesureHtml).join('')}</div>${cochesHtml(CEC.standCoches)}</div>

    <div class="carte"><h2>Budget de l'équipe</h2>
      <p class="aide">Limité à <b>${euros(CEC.budgetMax)}</b> par équipe (hors déplacements), prestations extérieures comprises. Un bon bilan est complet et a un solde proche de zéro.
      Valorisation : matériel gratuit ou offert = 5 à 10 % du prix du neuf ; prêt ≈ 5 % du prix du neuf par jour ; récupération = 10 % du prix du neuf (à inscrire en recette <i>et</i> en dépense) ;
      usinage par le Centre de Ressources = 100 € pour 1 exemplaire, 150 € pour 2, 50 € par exemplaire supplémentaire. Adhésion 50 € + pack 30 € payés par l'établissement.</p>
      <div id="bilan-budget"></div><div id="ed-budget"></div></div>

    <div class="carte"><h2>Livrables et obligations</h2><div class="resume" id="resume-livrables"></div>${cochesHtml(CEC.livrables)}</div>

    <div class="carte"><h2>Les épreuves et les 19 critères</h2>
      <p class="aide">Pour chaque critère, estimez votre niveau actuel avec les grilles du jury (Bas, Moyen, Haut) : cela montre où travailler en priorité.</p>
      <div class="resume" id="resume-auto"></div>${tableEpreuves(true)}</div>

    <div class="carte"><h2>Calendrier</h2><p class="aide">Les dates des finales sont fixées par le Centre de Ressources de l'académie : renseignez-les dès que vous les connaissez.</p>
      <div class="cal" id="cal"></div></div>`;

  /* --- mises à jour des résumés --- */
  const pastille = (ok, total, ko, mot) => `<span class="${ko ? 'ko' : ok === total ? 'ok' : ''}">${ko ? `⚠ ${ko} point${ko > 1 ? 's' : ''} non conforme${ko > 1 ? 's' : ''}` : ok === total ? `✓ ${mot}` : `${ok} / ${total} points vérifiés`}</span>`;
  const maj = () => {
    const v = bilanConformite(CEC.mesures, CEC.vehicule), st = bilanConformite(CEC.stand, CEC.standCoches);
    $('#resume-vehicule').innerHTML = pastille(v.ok, v.total, v.ko, 'Véhicule conforme');
    $('#resume-stand').innerHTML = pastille(st.ok, st.total, st.ko, 'Stand conforme');
    const lv = CEC.livrables.filter(([k]) => C.coches[k]).length;
    $('#resume-livrables').innerHTML = `<span class="${lv === CEC.livrables.length ? 'ok' : ''}">${lv} / ${CEC.livrables.length} faits</span>`;
    const crit = CEC.epreuves.flatMap(e => e.criteres.map(x => x[0]));
    const cpt = { bas: 0, moyen: 0, haut: 0 }; crit.forEach(k => { if (cpt[C.auto[k]] != null) cpt[C.auto[k]]++; });
    $('#resume-auto').innerHTML = `<span class="ok">Haut : ${cpt.haut}</span><span>Moyen : ${cpt.moyen}</span><span class="${cpt.bas ? 'ko' : ''}">Bas : ${cpt.bas}</span><span>Non évalués : ${crit.length - cpt.haut - cpt.moyen - cpt.bas}</span>`;
    const b = bilanBudget();
    $('#bilan-budget').innerHTML = `<div class="resume"><span>Recettes : ${euros(b.recettes)}</span><span class="${b.depenses > CEC.budgetMax ? 'ko' : ''}">Dépenses : ${euros(b.depenses)}</span><span class="${Math.abs(b.solde) < 1 ? 'ok' : ''}">Solde : ${b.solde > 0 ? '+' : ''}${euros(b.solde)}</span></div>
      ${b.depenses > CEC.budgetMax ? `<div class="alerte danger">⚠ Le budget dépasse ${euros(CEC.budgetMax)} : ce n'est pas autorisé par le règlement.</div>` : ''}`;
    const avecRole = new Set(Object.values(C.roles).flat());
    const sans = projet.eleves.filter(e => !avecRole.has(e.uid));
    $('#sans-role').innerHTML = sans.length && projet.eleves.length ? `<div class="alerte warn" style="margin-top:.6rem">Sans rôle : ${sans.map(e => esc(nomResponsable(e.uid))).join(', ')}.</div>` : '';
    // calendrier
    $('#cal').innerHTML = echeancesCec().map(e => `<div class="cal-ligne${e.prochaine ? ' prochaine' : ''}${e.passee ? ' passee' : ''}">
      <div><b>${esc(e.label)}</b><br><span class="aide">${e.fixe ? `du ${dateLongue(e.debut)} au ${dateLongue(e.date)} 2026` : e.calc ? (e.date ? `au plus tard le ${dateLongue(e.date)} (1 semaine avant la finale académique)` : 'renseignez la date de la finale académique') : ''}</span>
      ${e.date && !e.passee ? `<br><span class="compte">${joursAvant(e.date) === 0 ? 'Aujourd’hui !' : `dans ${joursAvant(e.date)} jour${joursAvant(e.date) > 1 ? 's' : ''}`}</span>` : e.passee ? '<br><span class="aide">✓ passé</span>' : ''}</div>
      ${e.fixe || e.calc ? '' : `<input type="date" data-date="${e.k}" value="${esc(e.date || '')}" aria-label="${esc(e.label)}">`}</div>`).join('');
  };

  /* --- événements --- */
  c.oninput = e => {
    const el = e.target;
    if (el.dataset.mesure) {
      C.mesures[el.dataset.mesure] = el.value === '' ? '' : nombre(el.value);
      const d = [...CEC.mesures, ...CEC.stand].find(x => x.k === el.dataset.mesure), st = etatMesure(d, C.mesures[d.k]);
      const zone = c.querySelector(`[data-statut="${d.k}"]`); zone.className = 'statut ' + st.etat; zone.textContent = st.txt;
    } else if (el.dataset.cec) C[el.dataset.cec] = el.value;
    else if (el.dataset.auto) C.auto[el.dataset.auto] = el.value;
    else return;
    sauver(); maj();
  };
  c.onchange = e => {
    const el = e.target;
    if (el.dataset.coche) { C.coches[el.dataset.coche] = el.checked; el.closest('label').classList.toggle('fait', el.checked); }
    else if (el.dataset.date) C.dates[el.dataset.date] = el.value;
    else return;
    sauver(); maj();
  };
  c.onclick = e => {
    const b = e.target.closest('[data-role]'); if (!b) return;
    const t = C.roles[b.dataset.role] || (C.roles[b.dataset.role] = []), i = t.indexOf(b.dataset.v);
    if (i >= 0) t.splice(i, 1); else t.push(b.dataset.v);
    b.classList.toggle('on', i < 0); sauver(); maj();
  };
  editeurListe($('#ed-budget'), {
    items: C.budget, ajouter: 'Ajouter une ligne', nouveau: () => ({ uid: uid(), date: isoDate(aujourdhui()), intitule: '', recette: '', depense: '' }),
    colonnes: [
      { k:'date', label:'Date', type:'date', largeur:'9.5rem' },
      { k:'intitule', label:'Intitulé', ph:'Ex. : Sponsor n°1, achat de roues…' },
      { k:'recette', label:'Recette (€)', type:'number', step:0.01, largeur:'7rem' },
      { k:'depense', label:'Dépense (€)', type:'number', step:0.01, largeur:'7rem' }
    ],
    onChange: () => { sauver(); maj(); }
  });
  $('#btn-imp-cec').onclick = () => imprimer('cec');
  maj();
}

const val = v => v && String(v).trim() ? esc(v) : '<span class="f-vide">Non renseigné</span>';
const bloc = (lab, v, style = '') => `<div class="f-bloc"${style ? ` style="${style}"` : ''}><div class="f-lab">${esc(lab)}</div><div class="f-val">${val(v)}</div></div>`;
const blocDiag = (lab, nom) => `<div class="f-bloc f-diag"><div class="f-lab">${esc(lab)}</div><div class="f-val">${svgDiagramme(nom)}</div></div>`;

function entete(titre, sousTitre, page, total) {
  return `<div class="f-entete"><div class="f-logo">${esc(NIVEAUX[projet.niveau].label)}</div>
    <div class="f-titre"><b>${esc(titre)}</b><span>${esc(sousTitre)}</span></div>
    <div class="f-page">Page ${page} / ${total}</div></div>`;
}
const pied = () => `<div class="f-pied"><span>${esc(projet.fiche.intitule || '')}</span><span>Édité le ${new Date().toLocaleDateString('fr-FR')}</span></div>`;

/* --- Fiche Première (modèle « Serre automatique ») --- */
function feuillesPremiere(avecPlanning) {
  const f = projet.fiche, ops = projet.options;
  const pages = [];
  const titre = 'Fiche de définition du projet', st = `Enseignement de spécialité I2D — Projet de ${NIVEAUX.premiere.heures} h`;
  pages.push(total => `
    ${entete(titre, st, 1, total)}
    <table class="f-tab">
      <tr><th>Intitulé du projet</th><td colspan="3"><b>${val(f.intitule)}</b></td></tr>
      <tr><th>Effectif du groupe</th><td style="width:30mm">${projet.eleves.length} élève${projet.eleves.length > 1 ? 's' : ''}</td><th style="width:28mm">Lycée</th><td>${val(f.lycee)}</td></tr>
      <tr><th>Enseignant responsable</th><td colspan="3">${val(f.enseignant)}</td></tr>
      <tr><th>Thème sociétal</th><td colspan="3">${val(f.theme)}</td></tr>
    </table>
    ${bloc('Besoin initial', f.besoin)}
    ${bloc('Finalité du produit', f.finalite)}
    ${bloc('Problème technique à résoudre', f.probleme)}
    ${bloc('Production finale attendue', f.production)}
    <table class="f-tab"><thead><tr><th style="width:24mm">Élève</th><th>Répartition des tâches</th>${DOMAINES.map(d => `<th style="width:19mm">${d}</th>`).join('')}</tr></thead><tbody>
      ${Array.from({ length: MAX_ELEVES }, (_, i) => {
        const e = projet.eleves[i];
        return `<tr><td><b>Élève ${i + 1}</b>${e && e.nom ? '<br>' + esc(e.nom) : ''}</td><td style="white-space:pre-wrap">${e ? esc(e.tache) : ''}</td>${DOMAINES.map(d => `<td class="f-x">${e && e.domaine === d ? '✕' : ''}</td>`).join('')}</tr>`;
      }).join('')}
    </tbody></table>
    ${pied()}`);
  if (ops.diagrammes) {
    pages.push(total => `${entete(titre, 'Diagrammes SysML', 2, total)}${blocDiag("Diagramme de cas d'utilisation", 'cas')}${blocDiag('Diagramme de contexte', 'contexte')}${pied()}`);
    pages.push(total => `${entete(titre, 'Diagrammes SysML', 3, total)}${blocDiag("Diagramme d'exigences", 'exigences')}${pied()}`);
  }
  if (avecPlanning) pages.push((total, n) => feuillePlanning(n, total));
  return pages;
}

      <div class="f-bloc f-diag"><div class="f-lab">Bête à cornes</div><div class="f-val">${svgBeteACornes()}</div></div>
      ${bloc('Ce que nous allons fabriquer', f.production)}
      <table class="f-tab"><thead><tr><th>Règlement</th><th style="width:30mm">Maximum</th><th style="width:30mm">Notre projet</th><th style="width:22mm">Conforme</th></tr></thead><tbody>
        ${[['Longueur de la voiture', SECONDE.voitureMax, f.voitureL], ['Largeur de la voiture', SECONDE.voitureMax, f.voiturel], ['Hauteur de la voiture', SECONDE.voitureMax, f.voitureH],
           ['Longueur du socle du stand', SECONDE.standMax, f.standL], ['Largeur du socle du stand', SECONDE.standMax, f.standl]]
          .map(([l, m, v]) => `<tr><td>${l}</td><td class="c">${m} mm</td><td class="c">${v === '' || v == null ? '' : esc(v) + ' mm'}</td><td class="c f-x">${v === '' || v == null ? '' : nombre(v) <= m ? '✓' : '<span style="color:#b00">✗</span>'}</td></tr>`).join('')}
      </tbody></table>
      ${bloc('Logiciels, machines et matériel', [(f.logiciels || []).join(', '), f.materiel].filter(Boolean).join('\n'))}
      <table class="f-tab"><thead><tr><th style="width:36mm">Élève</th><th>Sa partie du projet</th></tr></thead><tbody>
        ${Array.from({ length: Math.max(4, projet.eleves.length) }, (_, i) => {
          const e = projet.eleves[i];
          return `<tr><td><b>${e && e.nom ? esc(e.nom) : 'Élève ' + (i + 1)}</b></td><td style="white-space:pre-wrap;height:6mm">${e ? esc(e.tache) : ''}</td></tr>`;
        }).join('')}
      </tbody></table>
      ${pied()}`,
    total => `${entete(titre, 'Contexte et planning', 2, total)}
      ${blocDiag('Diagramme de contexte', 'contexte')}
      <div class="f-bloc"><div class="f-lab">Planning de l'année (${projet.seances.length} séances le vendredi, ${limiteHeures()} h)</div><div class="f-val" style="padding:1.5mm">${svgGanttSeconde(true)}</div></div>
      ${pied()}`
  ];
}

/* --- Fiche Terminale 2I2D (v3, 3 pages) --- */
function feuillesTerminale() {
  const f = projet.fiche;
  const titre = 'Fiche de présentation du projet de 2I2D', st = 'Baccalauréat technologique STI2D — Enseignement spécifique 2I2D';
  const them = f.thematique === 'Autre' ? 'Autre : ' + (f.thematiqueAutre || '…') : f.thematique;
  const cpt = compterSpecialites();
  return [
    total => `${entete(titre, st, 1, total)}
      <table class="f-tab">
        <tr><th>Session</th><td>${val(f.session)}</td><th style="width:44mm">Code UAI de l'établissement</th><td>${val(f.uai)}</td></tr>
        <tr><th>Intitulé du projet</th><td colspan="3"><b>${val(f.intitule)}</b></td></tr>
        <tr><th>Thématique</th><td colspan="3">${val(them)}</td></tr>
        <tr><th>Professeurs responsables</th><td colspan="3">${val(f.professeurs)}</td></tr>
      </table>
      ${bloc('Besoin initial', f.besoin)}
      ${bloc('Finalité en lien avec la thématique', f.finalite)}
      ${bloc('Problème technique à résoudre', f.probleme)}
      ${blocDiag("Diagramme de cas d'utilisation", 'cas')}
      ${pied()}`,
    total => `${entete(titre, st, 2, total)}${blocDiag('Diagramme de contexte', 'contexte')}${blocDiag("Diagramme d'exigences", 'exigences')}${pied()}`,
    total => `${entete(titre, st, 3, total)}
      <table class="f-tab"><thead><tr><th>Effectif de l'équipe</th>${SPECIALITES.map(s => `<th>${s}</th>`).join('')}</tr></thead>
        <tbody><tr><td class="c"><b>${projet.eleves.length}</b> élève${projet.eleves.length > 1 ? 's' : ''}</td>${SPECIALITES.map(s => `<td class="c">${cpt[s]}</td>`).join('')}</tr></tbody></table>
      ${bloc('Production finale attendue', f.production)}
      ${bloc('Liens avec la physique-chimie et/ou les mathématiques (STEM)', f.stem)}
      <table class="f-tab"><thead><tr><th style="width:18mm">Élève</th><th style="width:38mm">Nom</th><th style="width:20mm">Spécialité</th><th>Tâche de l'élève</th></tr></thead><tbody>
        ${Array.from({ length: MAX_ELEVES }, (_, i) => {
          const e = projet.eleves[i];
          return `<tr><td class="c"><b>${i + 1}</b></td><td>${e ? esc(e.nom) : ''}</td><td class="c">${e ? esc(e.specialite) : ''}</td><td style="white-space:pre-wrap;height:15mm">${e ? esc(e.tache) : ''}</td></tr>`;
        }).join('')}
      </tbody></table>
      ${pied()}`
  ];
}

/* --- Feuille « Planning » (annexe ou impression seule) --- */
function feuillePlanning(n, total) {
  const b = bilanHeures();
  const sec = projet.niveau === 'seconde';
  return `${entete('Planning des tâches', sec ? `${NIVEAUX.seconde.label} — ${projet.seances.length} séances, ${b.lim} h sur l'année` : `${NIVEAUX[projet.niveau].label} — ${b.lim} h par élève — ${fmtH(nombre(projet.planning.hps))} par semaine`, n, total)}
    <div class="f-bloc"><div class="f-lab">Diagramme de Gantt</div><div class="f-val" style="padding:1.5mm">${sec ? svgGanttSeconde(true) : svgGantt(true)}</div></div>
    <table class="f-tab"><thead><tr><th>Élève</th><th>Heures prévues</th><th>Heures disponibles</th><th>Écart</th></tr></thead><tbody>
      ${b.eleves.map(x => `<tr><td>${esc(x.nom)}</td><td class="c">${fmtH(x.h)}</td><td class="c">${b.lim} h</td><td class="c"${x.h > b.lim ? ' style="color:#b00;font-weight:700"' : ''}>${x.h > b.lim ? '+' : ''}${fmtH(x.h - b.lim)}</td></tr>`).join('')}
    </tbody></table>${pied()}`;
}

/* Construit le HTML de toutes les feuilles A4 */
function htmlFeuilles(mode) {
  let pages;
  if (mode === 'planning') pages = [(t, n) => feuillePlanning(n, t)];
  else if (mode === 'cec') pages = feuillesCec();
  else pages = { seconde: () => feuillesSeconde(), premiere: () => feuillesPremiere(projet.options.planning), terminale: () => feuillesTerminale() }[projet.niveau]();
  return pages.map((p, i) => `<section class="feuille">${p(pages.length, i + 1)}</section>`).join('');
}

/* Lance l'impression (le navigateur propose « Enregistrer au format PDF ») */
let impressionPreparee = false;
function imprimer(mode) {
  $('#impression').innerHTML = htmlFeuilles(mode);
  impressionPreparee = true;
  setTimeout(() => { window.print(); impressionPreparee = false; }, 50);
}
// Ctrl+P sans passer par le bouton : on prépare la fiche quand même
window.addEventListener('beforeprint', () => { if (projet && !impressionPreparee) $('#impression').innerHTML = htmlFeuilles('fiche'); });

/* Champs trop longs : risque de texte coupé sur la fiche imprimée */
function champsTropLongs() {
  return CHAMPS[projet.niveau].flatMap(s => s.champs).filter(d => d.max && (projet.fiche[d.k] || '').length > d.max).map(d => d.label);
}

function ongletExport(c) {
  const ter = projet.niveau === 'terminale';
  const longs = champsTropLongs();
  c.innerHTML = `<div class="carte"><h2>Export PDF de la fiche officielle</h2>
      <p class="aide">Cliquez sur « Imprimer / Enregistrer en PDF », puis choisissez <b>« Enregistrer au format PDF »</b> comme imprimante.
      Pour un résultat fidèle : format A4, marges « Aucune » ou « Par défaut », et cochez « Graphiques d'arrière-plan » si l'option existe.</p>
      ${projet.niveau === 'seconde' ? `<p class="aide">Fiche Seconde : 2 pages (le projet, la bête à cornes, le règlement et l'équipe ; le contexte et le planning de l'année).</p>` : ter ? `<p class="aide">Modèle Terminale : 3 pages (identification et cas d'utilisation ; contexte et exigences ; équipe, production, STEM et tâches).</p>` : `
      <p><label><input type="checkbox" id="o-diag" ${projet.options.diagrammes ? 'checked' : ''}> Ajouter les diagrammes SysML (2 pages)</label><br>
         <label><input type="checkbox" id="o-plan" ${projet.options.planning ? 'checked' : ''}> Ajouter le planning en annexe</label></p>`}
      ${longs.length ? `<div class="alerte warn">Certains textes dépassent la longueur conseillée et risquent d'être coupés sur la fiche : ${longs.map(esc).join(', ')}.</div>` : ''}
      <p style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn grand" id="btn-imp">🖨️ Imprimer / Enregistrer en PDF</button>
        <button class="btn secondaire grand" id="btn-imp-pl">🖨️ Planning seul</button>
        <button class="btn secondaire grand" id="btn-json2">💾 Exporter le projet (JSON)</button></p></div>
    <div class="carte"><h2>Aperçu</h2><div class="apercu" id="apercu"></div></div>`;
  const majApercu = () => { $('#apercu').innerHTML = htmlFeuilles('fiche'); };
  majApercu();
  if (projet.niveau === 'premiere') {
    $('#o-diag').onchange = e => { projet.options.diagrammes = e.target.checked; sauver(); majApercu(); };
    $('#o-plan').onchange = e => { projet.options.planning = e.target.checked; sauver(); majApercu(); };
  }
  $('#btn-imp').onclick = () => imprimer('fiche');
  $('#btn-imp-pl').onclick = () => imprimer('planning');
  $('#btn-json2').onclick = exporterJSON;
}

/* =====================================================================
   16. DÉMARRAGE
   ===================================================================== */
/* Installation sur tablette (application web installable) :
   uniquement quand l'appli est servie en https (ou sur localhost), pas en fichier local. */
function activerInstallation() {
  if (!/^https?:$/.test(location.protocol)) return;
  [['manifest', 'manifest.webmanifest'], ['apple-touch-icon', 'icones/apple-touch-icon.png']].forEach(([rel, href]) => {
    const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l);
  });
  if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
  // Demande au navigateur de ne pas effacer les données (projets) en cas de manque de place
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && projet && ongletActif === 'planning') afficherOnglet('planning');
});

(async function demarrer() {
  appliquerTheme(themeInitial());
  activerInstallation();
  serveurDisponible = await detecterServeur();
  const param = new URLSearchParams(location.search).get('projet');
  if (param && serveurDisponible && await ouvrirDepuisServeur(param)) return;
  afficherAccueil();
})();
</script>
