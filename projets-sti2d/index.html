    (localStorage) ou dans les fichiers JSON exportés.

<style>
/* =========================================================
   1. THÈME (variables de couleurs, mode clair / sombre)
   ========================================================= */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#eef1f6; --text:#1a2230; --muted:#5a6578;
  --border:#d3dae5; --primary:#1d5fc4; --primary-ink:#ffffff; --primary-soft:#e2ebfa;
  --danger:#c0262d; --danger-soft:#fde9e9; --ok:#23793a; --ok-soft:#e3f3e6; --warn:#9a5a00; --warn-soft:#fff2d9;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.06);
  /* Couleurs des diagrammes */
  --dg-bg:#ffffff; --dg-stroke:#283140; --dg-text:#161d28; --dg-muted:#556072; --dg-fill:#f8fafd;
  --dg-head:#e2ebfa; --dg-frame:#fcfdfe; --dg-grid:#e3e8ef;
  --dg-utilisateur:#e2ebfa; --dg-energie:#fff0d1; --dg-environnement:#e0f2e3; --dg-systeme:#eee5f8;
  --dg-auj-ligne:#fff3c4;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#18202a; --surface2:#212a36; --text:#e5eaf1; --muted:#98a4b6;
  --border:#313b49; --primary:#6ea6ff; --primary-ink:#0a1220; --primary-soft:#1c2c45;
  --danger:#ff7d7d; --danger-soft:#3a1d20; --ok:#72cf7f; --ok-soft:#163021; --warn:#ffbf5e; --warn-soft:#382a12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --dg-bg:#18202a; --dg-stroke:#b9c4d4; --dg-text:#e5eaf1; --dg-muted:#a3afc0; --dg-fill:#1f2833;
  --dg-head:#24354f; --dg-frame:#1a222d; --dg-grid:#2a3441;
  --dg-utilisateur:#22344f; --dg-energie:#3d3018; --dg-environnement:#1d3626; --dg-systeme:#33274a;
  --dg-auj-ligne:#3b3415;
  color-scheme:dark;
}

/* =========================================================
   2. MISE EN PAGE GÉNÉRALE
   ========================================================= */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Arial,sans-serif}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.7rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
.cache{display:none!important}

/* Barre du haut */
.barre{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem;flex-wrap:wrap}
.barre .logo svg{width:1.6rem;height:1.6rem;vertical-align:-.45rem;margin-right:.4rem}
.logo-accueil svg{width:84px;height:84px;display:block;margin:0 auto .6rem;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.barre .logo{font-weight:800;letter-spacing:.02em;color:var(--primary);cursor:pointer;white-space:nowrap}
.barre .titre-projet{flex:1;min-width:8rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barre .titre-projet small{display:inline-block;margin-left:.5rem;color:var(--muted);font-weight:500}
.etat-sauvegarde{color:var(--muted);font-size:.82rem;white-space:nowrap}
.barre .actions{display:flex;gap:.4rem;flex-wrap:wrap}

/* Boutons */
.btn{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--primary);background:var(--primary);color:var(--primary-ink);
  padding:.45rem .85rem;border-radius:8px;cursor:pointer;font-weight:600;font-size:.92rem;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.secondaire{background:var(--surface);color:var(--primary);border-color:var(--border)}
.btn.secondaire:hover{background:var(--primary-soft)}
.btn.discret{background:transparent;border-color:transparent;color:var(--muted)}
.btn.discret:hover{background:var(--surface2);color:var(--text)}
.btn.grand{padding:.7rem 1.1rem;font-size:1rem}
.ico{border:1px solid var(--border);background:var(--surface);border-radius:6px;width:1.9rem;height:1.9rem;cursor:pointer;color:var(--muted);padding:0}
.ico:hover{color:var(--text);background:var(--surface2)}
.ico.danger:hover{color:var(--danger);background:var(--danger-soft)}
.ico:disabled{opacity:.35;cursor:default}
/* Écrans tactiles (tablettes) : zones à toucher plus grandes */
@media (pointer:coarse){
  .ico{width:2.4rem;height:2.4rem;font-size:1rem}
  .btn{padding:.6rem 1rem}
  .puce{padding:.35rem .8rem}
  input[type=text],input[type=number],select,textarea{font-size:16px;padding:.55rem .65rem} /* 16 px : évite le zoom auto d'iOS */
}

/* Onglets */
.onglets{display:flex;gap:.25rem;padding:.5rem 1rem 0;border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto;position:sticky;top:var(--h-barre,52px);z-index:19}
.onglet{border:0;background:transparent;padding:.55rem .85rem;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.onglet:hover{color:var(--text)}
.onglet.actif{color:var(--primary);border-bottom-color:var(--primary)}
.onglet .pastille{display:inline-block;margin-left:.3rem;color:var(--danger)}

main{max-width:1400px;margin:0 auto;padding:1.2rem 1rem 4rem}
.carte{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.2rem;box-shadow:var(--shadow);margin-bottom:1rem}
.carte > h2:first-child,.carte > h3:first-child{margin-top:0}
.aide{color:var(--muted);font-size:.88rem}
.intro{color:var(--muted);margin:-.2rem 0 1rem;max-width:80ch}
.grille2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:1rem;align-items:start}
.colle{position:sticky;top:calc(var(--h-barre,52px) + 56px)}
@media (max-width:980px){.grille2{grid-template-columns:1fr}.colle{position:static}}

/* Formulaires */
.champ{margin-bottom:.9rem}
.champ label{display:block;font-weight:600;margin-bottom:.25rem}
.champ .aide{display:block;margin:-.1rem 0 .3rem}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:.45rem .6rem}
textarea{min-height:4.2rem;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:var(--primary)}
.ligne-champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 1rem}
.compteur{float:right;font-weight:400;color:var(--muted);font-size:.8rem}
.compteur.trop{color:var(--danger);font-weight:600}

/* Éditeur de listes (tableaux modifiables) */
.liste{overflow-x:auto;margin-bottom:.6rem}
table.tl{width:100%;border-collapse:collapse}
table.tl th{text-align:left;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:.3rem .35rem;border-bottom:1px solid var(--border)}
table.tl td{padding:.3rem .35rem;border-bottom:1px solid var(--border);vertical-align:top}
table.tl td.num,table.tl th.num{width:1.8rem;color:var(--muted);text-align:center;padding-top:.75rem}
table.tl td.act{white-space:nowrap;width:1%}
table.tl td.vide{color:var(--muted);text-align:center;font-style:italic;padding:1rem}
table.tl textarea{min-height:2.6rem}
.fiches{display:grid;gap:.7rem;margin-bottom:.7rem}
.fiche{border:1px solid var(--border);border-radius:10px;background:var(--surface2);padding:.6rem .75rem .75rem}
.fiche-tete{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.fiche-num{flex:1;font-weight:700;color:var(--primary)}
.fiche-actions{display:flex;gap:.3rem}
.fiche-champs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.55rem .75rem}
.fiche-champ.pleine{grid-column:1/-1}
.fiche-lab{display:block;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:.15rem}
.fiche textarea{min-height:3.2rem}
.vide-fiches{color:var(--muted);font-style:italic;text-align:center;margin:.5rem 0}
.puces{display:flex;flex-wrap:wrap;gap:.3rem}
.puce{white-space:nowrap;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:.15rem .6rem;font-size:.83rem;cursor:pointer}
.puce.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary);font-weight:600}
@media (max-width:700px){
  table.tl thead{display:none}
  table.tl tr{display:block;border:1px solid var(--border);border-radius:10px;margin-bottom:.6rem;padding:.3rem}
  table.tl td{display:block;border:0}
  table.tl td[data-label]::before{content:attr(data-label);display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase}
  table.tl td.num{display:none}
  table.tl td.act{text-align:right}
}

/* Alertes */
.alerte{border-radius:10px;padding:.7rem .9rem;margin-bottom:.8rem;border:1px solid}
.alerte.danger{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.alerte.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.alerte.info{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.alerte.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}

/* Accueil */
.accueil{max-width:1200px;margin:0 auto;padding:2rem 1rem 4rem}
.accueil header{text-align:center;margin-bottom:1.6rem}
.accueil header p{color:var(--muted);max-width:62ch;margin:.3rem auto 0}
.niveaux{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1rem}
.niveau{display:flex;flex-direction:column;gap:.7rem}
.niveau .tag{display:inline-block;font-size:.8rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;background:var(--primary-soft);color:var(--primary)}
.niveau ul{margin:0;padding-left:1.2rem;color:var(--muted);font-size:.92rem}
.niveau .boutons{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:auto}
.reprise{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;border-color:var(--primary)}
.reprise div{flex:1;min-width:12rem}

/* Diagrammes à l'écran */
.diag-carte .diag-barre{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
.diag-carte .diag-barre h3{margin:0;flex:1}
svg.diagramme{width:100%;height:auto;max-height:78vh;display:block;background:var(--dg-bg);border:1px solid var(--border);border-radius:10px;overflow:visible;user-select:none;-webkit-user-select:none}
svg.diagramme .dg-n{cursor:grab;touch-action:none}
svg.diagramme .dg-n.glisse{cursor:grabbing}
svg.diagramme .dg-n:hover .dg-forme{stroke-width:2.2}

/* Classes SVG communes (écran, aperçu et impression) */
.dg-forme{fill:var(--dg-fill);stroke:var(--dg-stroke);stroke-width:1.4}
.dg-tete{fill:var(--dg-head);stroke:var(--dg-stroke);stroke-width:1.4}
.dg-t{fill:var(--dg-text);font:12px system-ui,Arial,sans-serif}
.dg-t.gras{font-weight:700}
.dg-t.petit{font-size:10.5px;fill:var(--dg-muted)}
.dg-t.titre{font-size:12px;font-weight:700}
.dg-trait{stroke:var(--dg-stroke);stroke-width:1.3;fill:none}
.dg-trait.pointille{stroke-dasharray:6 4}
.dg-plein{fill:var(--dg-stroke);stroke:none}
.dg-vide{fill:var(--dg-bg);stroke:var(--dg-stroke);stroke-width:1.3}
.dg-etiq{fill:var(--dg-bg);stroke:none;opacity:.92}
.dg-cadre{fill:none;stroke:var(--dg-stroke);stroke-width:1}
.dg-cadre-tag{fill:var(--dg-bg);stroke:var(--dg-stroke);stroke-width:1}
.dg-systeme{fill:var(--dg-frame);stroke:var(--dg-stroke);stroke-width:1.5}
.dg-grille{stroke:var(--dg-grid);stroke-width:1}
.dg-placeholder{fill:var(--dg-muted);font:italic 14px system-ui,Arial,sans-serif}
.dg-auj{fill:var(--primary);opacity:.16}
.dg-auj-tete{fill:var(--primary)}
.dg-auj-txt{fill:var(--primary-ink)!important;font-weight:700}
.dg-auj-ligne{fill:var(--dg-auj-ligne)}
.dg-prochaine{fill:none;stroke:var(--primary);stroke-width:1.6;stroke-dasharray:5 3}
.aujourdhui ul{margin:.3rem 0 0;padding-left:1.2rem}
/* Onglet Course en Cours */
.cec-entete{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.cec-entete .theme{font-size:1.35rem;font-weight:800;color:var(--primary)}
.mesures{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.7rem}
.mesure{border:1px solid var(--border);border-radius:10px;padding:.6rem .7rem;background:var(--surface2)}
.mesure label{display:block;font-weight:600;font-size:.9rem}
.mesure .limite{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.3rem}
.mesure .saisie{display:flex;align-items:center;gap:.4rem}
.mesure .saisie input{max-width:8rem}
.statut{font-size:.85rem;font-weight:700;margin-top:.25rem;min-height:1.2em}
.statut.ok{color:var(--ok)} .statut.ko{color:var(--danger)}
.coches{display:grid;gap:.35rem;margin:.4rem 0}
.coches label{display:flex;gap:.55rem;align-items:flex-start;padding:.35rem .5rem;border-radius:8px;cursor:pointer}
.coches label:hover{background:var(--surface2)}
.coches input{width:1.2rem;height:1.2rem;flex:none;margin-top:.15rem}
.coches label.fait{color:var(--muted)}
.coches label.fait span{text-decoration:line-through}
.resume{display:flex;gap:.6rem;flex-wrap:wrap;margin:.3rem 0 .8rem}
.resume span{padding:.25rem .65rem;border-radius:999px;font-weight:700;font-size:.85rem;background:var(--surface2)}
.resume span.ok{background:var(--ok-soft);color:var(--ok)} .resume span.ko{background:var(--danger-soft);color:var(--danger)}
.roles{display:grid;gap:.6rem}
.role{border:1px solid var(--border);border-radius:10px;padding:.55rem .7rem}
.role b{display:block} .role .aide{display:block;margin-bottom:.35rem}
table.cec-tab{width:100%;border-collapse:collapse;margin:.3rem 0 .8rem}
table.cec-tab th,table.cec-tab td{border-bottom:1px solid var(--border);padding:.4rem .45rem;text-align:left;vertical-align:top}
table.cec-tab th{font-size:.8rem;text-transform:uppercase;color:var(--muted)}
table.cec-tab select{width:auto;min-width:9rem}
.cal{display:grid;gap:.5rem}
.cal-ligne{display:grid;grid-template-columns:minmax(10rem,1fr) auto;gap:.6rem;align-items:center;border:1px solid var(--border);border-radius:10px;padding:.5rem .7rem}
.cal-ligne.prochaine{border-color:var(--primary);background:var(--primary-soft)}
.cal-ligne.passee{opacity:.6}
.cal-ligne input{width:auto}
.compte{font-weight:700;color:var(--primary)}
.aujourdhui li{margin:.15rem 0}
.cat-utilisateur{fill:var(--dg-utilisateur)} .cat-energie{fill:var(--dg-energie)}
.cat-environnement{fill:var(--dg-environnement)} .cat-systeme{fill:var(--dg-systeme)}

/* Planning */
.bilan{display:grid;gap:.5rem}
.bilan-ligne{display:grid;grid-template-columns:minmax(7rem,12rem) 1fr 6.5rem;gap:.6rem;align-items:center}
.jauge{height:.8rem;border-radius:999px;background:var(--surface2);overflow:hidden;position:relative}
.jauge span{display:block;height:100%;border-radius:999px;background:var(--ok)}
.jauge span.sous{background:var(--primary)} .jauge span.trop{background:var(--danger)}
.bilan-ligne b.trop{color:var(--danger)}
svg.gantt{width:100%;height:auto;display:block;background:var(--dg-bg);border:1px solid var(--border);border-radius:10px}
.defile{overflow-x:auto}

/* Bandeau de notification (toast) */
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:.6rem 1rem;border-radius:10px;
  box-shadow:var(--shadow);z-index:100;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.visible{opacity:1}
.credit{text-align:center;color:var(--muted);font-size:.8rem;margin:1.5rem 0 0}

/* =========================================================
   3. FEUILLES A4 (aperçu à l'écran + impression PDF)
   ========================================================= */
.apercu{overflow:auto;background:var(--surface2);border-radius:12px;padding:1rem;border:1px solid var(--border)}
.apercu .feuille{margin:0 auto 1rem;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.feuille{
  /* La feuille est toujours en clair, même en mode sombre */
  --dg-bg:#ffffff; --dg-stroke:#1d232c; --dg-text:#111; --dg-muted:#444; --dg-fill:#ffffff; --dg-head:#e6edf8;
  --dg-frame:#ffffff; --dg-grid:#dfe3ea; --dg-utilisateur:#e6edf8; --dg-energie:#fff1d4; --dg-environnement:#e3f3e6; --dg-systeme:#f0e8f9;
  width:210mm;height:296mm;padding:9mm 11mm 8mm;background:#fff;color:#111;display:flex;flex-direction:column;overflow:hidden;
  font:9.6pt/1.35 Arial,"Liberation Sans",Helvetica,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.feuille *{color:inherit}
.f-entete{display:flex;align-items:stretch;border:1.5px solid #111;margin-bottom:3mm}
.f-entete .f-logo{width:34mm;border-right:1.5px solid #111;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:9pt;padding:1.5mm;background:#e6edf8}
.f-entete .f-titre{flex:1;text-align:center;padding:2mm;display:flex;flex-direction:column;justify-content:center}
.f-entete .f-titre b{font-size:12.5pt;display:block}
.f-entete .f-titre span{font-size:9pt}
.f-entete .f-page{width:22mm;border-left:1.5px solid #111;display:flex;align-items:center;justify-content:center;font-size:8.5pt}
.f-tab{width:100%;border-collapse:collapse;margin-bottom:2.5mm}
.f-tab th,.f-tab td{border:1px solid #111;padding:1.2mm 1.8mm;vertical-align:top;text-align:left}
.f-tab th{background:#e6edf8;font-weight:700;width:42mm}
.f-tab thead th{width:auto;text-align:center}
.f-tab td.c{text-align:center}
.f-bloc{border:1px solid #111;margin-bottom:2.5mm}
.f-bloc > .f-lab{background:#e6edf8;font-weight:700;padding:1mm 1.8mm;border-bottom:1px solid #111}
.f-bloc > .f-val{padding:1.4mm 1.8mm;white-space:pre-wrap;min-height:9mm}
.f-diag{flex:1 1 0;min-height:0;display:flex;flex-direction:column}

/* Dates au format AAAA-MM-JJ (sans décalage de fuseau horaire) */
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const lireDate = iso => { const [a, m, j] = String(iso || '').split('-').map(Number); return a ? new Date(a, m - 1, j) : null; };
const dateCourte = iso => { const d = lireDate(iso); return d ? d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) : '?'; };
const dateLongue = iso => { const d = lireDate(iso); return d ? d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) : '?'; };

/* Date du jour (à minuit). window.DATE_TEST permet de simuler une autre date pour les essais. */

}

/* Calendrier par défaut des séances de Seconde */
function seancesParDefaut() {
  const liste = [], d = lireDate(SECONDE.debut), fin = lireDate(SECONDE.fin);
  for (let i = 0; d <= fin; i++, d.setDate(d.getDate() + 7)) {
    const iso = isoDate(d);
    if (!SECONDE.sansCours.includes(iso)) liste.push({ uid: uid(), date: iso, duree: SECONDE.durees[i % SECONDE.durees.length] });
  }
  return liste;
}

const nombre = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const arrondi = n => Math.round(n * 10) / 10;
const fmtH = n => String(arrondi(n)).replace('.', ',') + ' h';

/* Petit message temporaire en bas de l'écran */
function notifier(msg, duree = 2800) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('visible');
  clearTimeout(notifier._t); notifier._t = setTimeout(() => t.classList.remove('visible'), duree);
}

/* Découpe un texte en lignes d'au plus « max » caractères (pour les SVG) */
function couper(texte, max) {
  const lignes = [];
  String(texte ?? '').split(/\n/).forEach(par => {
    let ligne = '';
    par.split(/\s+/).filter(Boolean).forEach(mot => {
      while (mot.length > max) {                    // mot trop long : on le coupe
        if (ligne) { lignes.push(ligne); ligne = ''; }
        lignes.push(mot.slice(0, max - 1) + '-'); mot = mot.slice(max - 1);
      }
      if (!ligne) ligne = mot;
      else if ((ligne + ' ' + mot).length <= max) ligne += ' ' + mot;
      else { lignes.push(ligne); ligne = mot; }
    });
    if (ligne) lignes.push(ligne);
  });
  return lignes.length ? lignes : [''];
}

/* Nom de fichier sans accents ni caractères spéciaux */
function slug(t) {
  return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'projet';
}

}

    acteurs: [],        // {uid, nom}

                        // Seconde : {uid, nom, eleves:[uid], outil, seance (uid), duree}
    seances: niveau === 'seconde' ? seancesParDefaut() : [],   // Seconde : {uid, date, duree}
    planning: { hps: N.hps, semaines: N.semaines, heures: N.heures },
    positions: { exigences:{}, cas:{}, contexte:{} },  // positions déplacées à la souris

/* Complète un projet importé avec les champs manquants (anciens fichiers, fichiers incomplets) */
function normaliser(p) {
  if (!p || typeof p !== 'object' || !NIVEAUX[p.niveau]) throw new Error('Fichier non reconnu : niveau absent ou invalide.');
  const base = projetVide(p.niveau);
  const r = Object.assign(base, p);
  r.fiche = Object.assign(projetVide(p.niveau).fiche, p.fiche || {});
  r.planning = Object.assign(base.planning, p.planning || {});
  r.positions = Object.assign({ exigences:{}, cas:{}, contexte:{} }, p.positions || {});
  r.options = Object.assign({ diagrammes:true, planning:false }, p.options || {});
  r.envoi = Object.assign({ equipe:'' }, p.envoi || {});
  r.cec = Object.assign(cecVide(), p.cec || {});
  ['mesures', 'coches', 'roles', 'auto'].forEach(k => { if (!r.cec[k] || typeof r.cec[k] !== 'object') r.cec[k] = {}; });
  r.cec.dates = Object.assign(cecVide().dates, r.cec.dates || {});
  if (!Array.isArray(r.cec.budget)) r.cec.budget = [];
  r.cec.budget.forEach(x => { if (!x.uid) x.uid = uid(); });
  ['eleves','exigences','acteurs','cas','contexte','taches'].forEach(k => {
    r[k] = Array.isArray(p[k]) ? p[k].filter(x => x && typeof x === 'object') : base[k];
    r[k].forEach(x => { if (!x.uid) x.uid = uid(); });
  });
  r.cas.forEach(c => { if (!Array.isArray(c.acteurs)) c.acteurs = []; });
  if (r.niveau === 'seconde') {
    if (!Array.isArray(r.fiche.logiciels)) r.fiche.logiciels = [];
    r.seances = Array.isArray(p.seances) && p.seances.length ? p.seances.filter(x => x && x.date) : seancesParDefaut();
    r.seances.forEach(x => { if (!x.uid) x.uid = uid(); });
    // Anciennes tâches (responsable + semaine) converties au format Seconde (élèves + séance)
    r.taches.forEach(t => {
      if (!Array.isArray(t.eleves)) t.eleves = t.responsable === 'equipe' ? r.eleves.map(e => e.uid) : (t.responsable ? [t.responsable] : []);
      if (!t.seance) { const i = Math.max(0, Math.round(nombre(t.semaine)) - 1); t.seance = (r.seances[Math.min(i, r.seances.length - 1)] || {}).uid || ''; }
      if (t.outil == null) t.outil = '';
    });
  }
  if (!r.eleves.length) r.eleves = [nouvelEleve(r.niveau)];
  r.app = APP_ID; r.version = VERSION_FORMAT;
  return r;
}

/* =====================================================================
   4. SAUVEGARDE (localStorage), EXPORT / IMPORT JSON
   ===================================================================== */
function lireSauvegarde() {
  try { const s = localStorage.getItem(CLE_STOCKAGE); return s ? normaliser(JSON.parse(s)) : null; }
  catch (e) { return null; }
}

/* Sauvegarde automatique, différée pour ne pas écrire à chaque frappe */
function sauver() {
  if (!projet) return;
  projet.modifie = Date.now();
  const etat = $('#etat-sauvegarde'); if (etat) etat.textContent = 'Enregistrement…';
  clearTimeout(sauver._t);
  sauver._t = setTimeout(() => {
    try {
      localStorage.setItem(CLE_STOCKAGE, JSON.stringify(projet));
      if (etat) etat.textContent = '✓ Enregistré dans ce navigateur';
    } catch (e) {
      if (etat) etat.textContent = '⚠ Sauvegarde impossible (exportez en JSON)';
    }
  }, 350);
}

function telecharger(nomFichier, contenu, type) {
  const blob = new Blob([contenu], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nomFichier;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function exporterJSON() {
  telecharger(`projet-${projet.niveau}-${slug(projet.fiche.intitule)}.json`, JSON.stringify(projet, null, 2), 'application/json');
  notifier('Fichier JSON téléchargé : rendez-le au professeur ou gardez-le pour reprendre le projet ailleurs.');
}

function importerJSON() {
  const input = $('#fichier-json'); input.value = '';
  input.onchange = () => {
    const f = input.files[0]; if (!f) return;
    const lecteur = new FileReader();
    lecteur.onload = () => {
      try {
        const p = normaliser(JSON.parse(lecteur.result));
        if (!confirmerRemplacement()) return;
        ouvrirProjet(p); notifier('Projet « ' + (p.fiche.intitule || 'sans titre') + ' » ouvert.');
      } catch (e) { alert("Impossible d'ouvrir ce fichier.\n" + e.message); }
    };
    lecteur.readAsText(f, 'utf-8');
  };
  input.click();
}

/* Demande confirmation avant d'écraser un projet en cours non vide */
function confirmerRemplacement() {
  const s = lireSauvegarde();
  if (!s || (!s.fiche.intitule && !s.exigences.length && !s.taches.length)) return true;
  return confirm(`Le projet en cours « ${s.fiche.intitule || 'sans titre'} » va être remplacé dans ce navigateur.\n\nPensez à l'exporter en JSON si vous voulez le garder.\n\nContinuer ?`);
}

/* =====================================================================
   5. MODE SERVEUR (si l'application est servie par serveur.py)
   ===================================================================== */
async function detecterServeur() {
  if (!/^https?:$/.test(location.protocol)) return false;
  try {
    const r = await fetch('api/ping', { cache: 'no-store' });
    const j = await r.json();
    return !!(j && j.ok && j.serveur === APP_ID);
  } catch (e) { return false; }
}

async function envoyerAuProfesseur() {
  const equipe = prompt("Nom de l'équipe et classe (ex. : « 1STI2D-B équipe 3 ») :", projet.envoi.equipe || '');
  if (equipe === null) return;
  if (!equipe.trim()) { alert("Indiquez un nom d'équipe pour que le professeur retrouve votre projet."); return; }
  projet.envoi.equipe = equipe.trim(); sauver();
  try {
    const r = await fetch('api/projets', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(projet) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.erreur || ('Erreur ' + r.status));
    notifier('✓ Projet envoyé au professeur (' + j.fichier + ').', 4000);
  } catch (e) { alert("L'envoi a échoué : " + e.message + "\nVous pouvez exporter le projet en JSON à la place."); }
}

/* Ouverture d'un projet du serveur (lien « Ouvrir » de la page professeur : ?projet=nom.json) */
async function ouvrirDepuisServeur(nom) {
  try {
    const r = await fetch('api/projets/' + encodeURIComponent(nom), { cache:'no-store' });
    if (!r.ok) throw new Error('Erreur ' + r.status);
    const p = normaliser(await r.json());
    history.replaceState(null, '', location.pathname);
    ouvrirProjet(p); notifier('Projet du serveur ouvert : ' + nom);
    return true;
  } catch (e) { alert("Impossible d'ouvrir le projet " + nom + ' : ' + e.message); return false; }
}

/* =====================================================================
   6. THÈME CLAIR / SOMBRE
   ===================================================================== */
function appliquerTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem(CLE_THEME, t); } catch (e) {}
  const b = $('#btn-theme'); if (b) b.textContent = t === 'dark' ? '☀️' : '🌙';
}
function themeInitial() {
  try { const t = localStorage.getItem(CLE_THEME); if (t) return t; } catch (e) {}
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
const basculerTheme = () => appliquerTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

            : n === 'premiere'

            : `<li>Fiche de présentation 2I2D sur 3 pages</li><li>Équipe par spécialité (AC, EE, ITEC, SIN) et liens STEM</li><li>Exemple : « Maison autonome à énergie optimisée »</li><li>Diagrammes SysML et planning de Gantt</li>`}

    </div>

      <div style="flex:1;min-width:14rem"><b>Vous avez déjà un fichier de projet ?</b><br><span class="aide">Ouvrez le fichier .json exporté depuis cette application (sur ce poste ou un autre).</span></div>
      <button class="btn secondaire grand" data-action="ouvrir">📂 Ouvrir un projet enregistré</button>
    </div>
    <p class="aide" style="text-align:center">🔒 Vos données restent sur cet ordinateur : rien n'est envoyé sur Internet.${serveurDisponible ? ' Connecté au serveur du lycée : vous pourrez envoyer votre projet au professeur.' : ''}</p>
    <p class="credit">${CREDIT}</p>
  </div>`;
  appliquerTheme(document.documentElement.getAttribute('data-theme'));
  $('#app').onclick = e => {
    const b = e.target.closest('[data-action]'); if (!b) return;
    const a = b.dataset.action, n = b.dataset.niveau;
    if (a === 'reprendre') ouvrirProjet(s);
    else if (a === 'nouveau') { if (confirmerRemplacement()) ouvrirProjet(projetVide(n)); }
    else if (a === 'exemple') { if (confirmerRemplacement()) { ouvrirProjet({ seconde: exempleSeconde, premiere: exemplePremiere, terminale: exempleTerminale }[n]()); notifier('Exemple chargé : modifiez-le librement.'); } }
    else if (a === 'ouvrir') importerJSON();
  };
  $('#btn-theme').onclick = basculerTheme;
}

}

/* Appelée après chaque modification */
function modifie() { sauver(); majEntete(); }

/* =====================================================================
   9. ÉDITEUR DE LISTES GÉNÉRIQUE (ajouter / supprimer / déplacer une ligne)
   ---------------------------------------------------------------------
   cfg = {
     items       : tableau modifié directement,
     colonnes    : [{k, label, type:'text'|'textarea'|'number'|'select'|'puces', options:()=>[[valeur,libellé]], ph, largeur, structurel}],
     nouveau     : () => objet,   ajouter : libellé du bouton,   max : nombre maxi de lignes,
     onChange    : (structurel) => {}   (structurel = vrai si ajout / suppression / changement d'identifiant)
   }
   ===================================================================== */
function editeurListe(cont, cfg) {
  const cellule = (c, it) => {
    const v = it[c.k] ?? '';
    const ph = c.ph ? ` placeholder="${esc(c.ph)}"` : '';
    switch (c.type) {
      case 'textarea': return `<textarea data-k="${c.k}" rows="2"${ph}>${esc(v)}</textarea>`;
      case 'number':   return `<input type="number" data-k="${c.k}" value="${esc(v)}" min="${c.min ?? 0}" step="${c.step ?? 1}"${ph}>`;
      case 'date':     return `<input type="date" data-k="${c.k}" value="${esc(v)}">`;
      case 'select':   return `<select data-k="${c.k}">${c.options(it).map(([val, lab]) => `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
      case 'puces': {
        const opts = c.options(it);
        if (!opts.length) return `<span class="aide">${esc(c.vide || 'Aucun choix disponible')}</span>`;
        const sel = Array.isArray(v) ? v : [];
        const tous = c.tous ? `<button type="button" class="puce${opts.every(([val]) => sel.includes(val)) ? ' on' : ''}" data-act="puce-tous" data-k="${c.k}">Tout le groupe</button>` : '';
        return `<div class="puces">${tous}${opts.map(([val, lab]) => `<button type="button" class="puce${sel.includes(val) ? ' on' : ''}" data-act="puce" data-k="${c.k}" data-v="${esc(val)}" aria-pressed="${sel.includes(val)}">${esc(lab || '(sans nom)')}</button>`).join('')}</div>`;
      }
      default: return `<input type="text" data-k="${c.k}" value="${esc(v)}"${ph}>`;
    }
  };

  /* Redessine le tableau en conservant le champ qui avait le focus */
  const rendre = () => {
    const actif = document.activeElement, focus = cont.contains(actif) && actif.dataset.k
      ? { i: actif.closest('[data-i]')?.dataset.i, k: actif.dataset.k, s: actif.selectionStart, e: actif.selectionEnd } : null;
    const cols = cfg.colonnes, n = cfg.items.length;
    const boutons = i => `<button type="button" class="ico" data-act="haut" title="Monter" aria-label="Monter" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button type="button" class="ico" data-act="bas" title="Descendre" aria-label="Descendre" ${i === n - 1 ? 'disabled' : ''}>↓</button>
        <button type="button" class="ico danger" data-act="suppr" title="Supprimer" aria-label="Supprimer">✕</button>`;
    let h;
    if (cfg.cartes) {
      /* Mode « fiches » : une petite fiche par ligne, chaque champ avec son titre (lisible sur tablette) */
      h = `<div class="fiches">` + cfg.items.map((it, i) => `<div class="fiche" data-i="${i}">
          <div class="fiche-tete"><span class="fiche-num">${esc(cfg.nomLigne || 'Ligne')} ${i + 1}</span><span class="fiche-actions">${boutons(i)}</span></div>
          <div class="fiche-champs">${cols.map(c => `<div class="fiche-champ${c.type === 'textarea' || c.type === 'puces' || c.pleine ? ' pleine' : ''}">
            <span class="fiche-lab">${esc(c.label)}</span>${cellule(c, it)}</div>`).join('')}</div></div>`).join('') +
        (n ? '' : `<p class="vide-fiches">Aucune ligne pour l'instant : touchez « ${esc(cfg.ajouter || 'Ajouter')} ».</p>`) + `</div>`;
    } else {
    h = `<div class="liste"><table class="tl"><thead><tr><th class="num">#</th>${cols.map(c => `<th${c.largeur ? ` style="width:${c.largeur}"` : ''}>${esc(c.label)}</th>`).join('')}<th class="act"></th></tr></thead><tbody>`;
    cfg.items.forEach((it, i) => {
      h += `<tr data-i="${i}"><td class="num">${i + 1}</td>${cols.map(c => `<td data-label="${esc(c.label)}">${cellule(c, it)}</td>`).join('')}
        <td class="act"><button type="button" class="ico" data-act="haut" title="Monter" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button type="button" class="ico" data-act="bas" title="Descendre" ${i === n - 1 ? 'disabled' : ''}>↓</button>
        <button type="button" class="ico danger" data-act="suppr" title="Supprimer la ligne">✕</button></td></tr>`;
    });
    if (!n) h += `<tr><td colspan="${cols.length + 2}" class="vide">Aucune ligne pour l'instant : cliquez sur « ${esc(cfg.ajouter || 'Ajouter')} ».</td></tr>`;
    h += `</tbody></table></div>`;
    }
    const plein = cfg.max && n >= cfg.max;
    h += `<button type="button" class="btn secondaire" data-act="ajout" ${plein ? 'disabled' : ''}>＋ ${esc(cfg.ajouter || 'Ajouter une ligne')}</button>
          ${plein ? `<span class="aide"> (maximum ${cfg.max})</span>` : ''}`;
    cont.innerHTML = h;
    if (focus) {
      const el = cont.querySelector(`[data-i="${focus.i}"] [data-k="${focus.k}"]`);
      if (el && el.tagName !== 'BUTTON') { el.focus(); try { if (focus.s != null) el.setSelectionRange(focus.s, focus.e); } catch (e) {} }
    }
  };

  const colonne = k => cfg.colonnes.find(c => c.k === k);
  // Saisie : on modifie l'objet sans redessiner (le focus est conservé)
  cont.oninput = e => {
    const el = e.target, tr = el.closest('[data-i]'); if (!tr || !el.dataset.k || el.dataset.act) return;
    const c = colonne(el.dataset.k), it = cfg.items[+tr.dataset.i];
    it[c.k] = c.type === 'number' ? (el.value === '' ? '' : nombre(el.value)) : el.value;
    cfg.onChange(false);
  };
  // Fin de saisie d'un champ « structurel » (identifiant, nom…) : on prévient les autres vues
  cont.onchange = e => {
    const el = e.target; if (!el.dataset.k) return;
    const c = colonne(el.dataset.k);
    if (c && c.structurel) { cfg.onChange(true); setTimeout(rendre, 0); }
  };
  cont.onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const tr = b.closest('[data-i]'), i = tr ? +tr.dataset.i : -1, it = cfg.items;
    switch (b.dataset.act) {
      case 'ajout': it.push(cfg.nouveau()); break;
      case 'suppr': it.splice(i, 1); break;
      case 'haut': [it[i - 1], it[i]] = [it[i], it[i - 1]]; break;
      case 'bas': [it[i + 1], it[i]] = [it[i], it[i + 1]]; break;
      case 'puce-tous': {
        const k = b.dataset.k, c = colonne(k), opts = c.options(it[i]).map(o => o[0]);
        it[i][k] = opts.every(v => (it[i][k] || []).includes(v)) ? [] : [...opts];
        break;
      }
      case 'puce': {
        const k = b.dataset.k, v = b.dataset.v; const t = Array.isArray(it[i][k]) ? it[i][k] : (it[i][k] = []);
        const j = t.indexOf(v); if (j >= 0) t.splice(j, 1); else t.push(v);
        break;
      }
    }
    rendre(); cfg.onChange(true);
    if (b.dataset.act === 'ajout') { const champ = cont.querySelector(`[data-i="${it.length - 1}"] input, [data-i="${it.length - 1}"] textarea`); if (champ) champ.focus(); }
  };
  rendre();
  return { rendre };
}

function ongletFiche(c) {
  const f = projet.fiche;
  const champ = d => {
    if (d.si && !d.si(f)) return '';
    const v = Array.isArray(f[d.k]) ? '' : (f[d.k] ?? '');
    const cpt = d.max ? `<span class="compteur${v.length > d.max ? ' trop' : ''}" data-cpt="${d.k}">${v.length} / ${d.max}</span>` : '';
    let input;
    if (d.type === 'textarea') input = `<textarea id="f-${d.k}" data-k="${d.k}" rows="3">${esc(v)}</textarea>`;
    else if (d.type === 'nombre') input = `<input type="number" id="f-${d.k}" data-k="${d.k}" value="${esc(v)}" min="0" step="1" inputmode="numeric">`;
    else if (d.type === 'puces') input = `<div class="puces">${d.options.map(o => `<button type="button" class="puce${(f[d.k] || []).includes(o) ? ' on' : ''}" data-puce="${d.k}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    else if (d.type === 'select') input = `<select id="f-${d.k}" data-k="${d.k}"><option value="">— Choisir —</option>${d.options.map(o => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else input = `<input type="text" id="f-${d.k}" data-k="${d.k}" value="${esc(v)}" placeholder="${esc(d.ph || '')}">`;
    const err = d.verif ? d.verif(v) : '';
    return `<div class="champ"><label for="f-${d.k}">${esc(d.label)}${cpt}</label>${d.aide ? `<span class="aide">${esc(d.aide)}</span>` : ''}${input}
      <span class="aide" data-err="${d.k}" style="color:${err.startsWith('✓') ? 'var(--ok)' : 'var(--danger)'}">${esc(err)}</span></div>`;
  };
  const rendre = () => {
    c.innerHTML = `<p class="intro">Modèle : ${esc(NIVEAUX[projet.niveau].modele)}. Tout est enregistré automatiquement dans ce navigateur.
      ${projet.niveau === 'seconde' ? '' : projet.niveau === 'premiere' ? 'L\'effectif du groupe est calculé à partir de la liste des élèves (onglet « Équipe et tâches »).' : 'L\'effectif et la composition de l\'équipe sont calculés à partir de la liste des élèves (onglet « Équipe et tâches »).'}</p>` +
      CHAMPS[projet.niveau].map(s => `<div class="carte"><h2>${esc(s.titre)}</h2><div class="${s.champs.every(x => x.court || x.k === 'intitule') ? 'ligne-champs' : ''}">${s.champs.map(champ).join('')}</div></div>`).join('');
  };
  rendre();
  const def = k => CHAMPS[projet.niveau].flatMap(s => s.champs).find(d => d.k === k);
  c.oninput = e => {
    const k = e.target.dataset.k; if (!k) return;
    f[k] = e.target.value;
    const d = def(k);
    if (d.type === 'nombre') f[k] = e.target.value === '' ? '' : nombre(e.target.value);
    const cpt = c.querySelector(`[data-cpt="${k}"]`);
    if (cpt) { cpt.textContent = `${f[k].length} / ${d.max}`; cpt.classList.toggle('trop', f[k].length > d.max); }
    if (d.verif) { const el = c.querySelector(`[data-err="${k}"]`), t = d.verif(f[k]); el.textContent = t; el.style.color = t.startsWith('✓') ? 'var(--ok)' : 'var(--danger)'; }
    if (k === 'thematique') { rendre(); $('#f-thematique').focus(); }
    modifie();
  };
  // Cases à cocher en « puces » (logiciels de la Seconde)
  c.onclick = e => {
    const b = e.target.closest('[data-puce]'); if (!b) return;
    const k = b.dataset.puce, t = Array.isArray(f[k]) ? f[k] : (f[k] = []), i = t.indexOf(b.dataset.v);
    if (i >= 0) t.splice(i, 1); else t.push(b.dataset.v);
    b.classList.toggle('on', i < 0); modifie();
  };
}

/* =====================================================================
   11. ONGLET « ÉQUIPE ET TÂCHES »
   ===================================================================== */
function ongletEquipe(c) {
  if (projet.niveau === 'seconde') return ongletEquipeSeconde(c);
  const ter = projet.niveau === 'terminale';
  c.innerHTML = `
    <p class="intro">${ter ? 'Indiquez chaque élève (5 au maximum), sa spécialité et la tâche dont il est responsable.' : 'Indiquez chaque élève (5 au maximum), sa tâche et le domaine auquel elle se rattache : Énergie, Information ou Matière.'}</p>
    <div class="carte"><h2>${ter ? 'Tâche de chaque élève' : 'Répartition des tâches'}</h2><div id="ed-eleves"></div></div>
    <div class="carte" id="synthese-equipe"></div>`;
  const synthese = () => {
    const n = projet.eleves.length;
    let h = `<h2>Effectif ${ter ? 'et composition de l’équipe' : 'du groupe'}</h2><p><b>${n}</b> élève${n > 1 ? 's' : ''}.</p>`;
    if (ter) {
      const cpt = compterSpecialites();
      h += `<div class="liste"><table class="tl" style="max-width:520px"><thead><tr>${SPECIALITES.map(s => `<th title="${esc(SPECIALITES_NOMS[s])}">${s}</th>`).join('')}<th>Total</th></tr></thead>
        <tbody><tr>${SPECIALITES.map(s => `<td>${cpt[s]}</td>`).join('')}<td><b>${n}</b></td></tr></tbody></table></div>
        <p class="aide">${SPECIALITES.map(s => `${s} : ${SPECIALITES_NOMS[s]}`).join(' · ')}</p>`;
    } else {
      const d = {}; DOMAINES.forEach(x => d[x] = projet.eleves.filter(e => e.domaine === x).length);
      h += `<p class="aide">${DOMAINES.map(x => `${x} : ${d[x]} tâche${d[x] > 1 ? 's' : ''}`).join(' · ')}</p>`;
      const manquants = DOMAINES.filter(x => !d[x]);
      if (manquants.length && n >= 3) h += `<div class="alerte warn">Aucune tâche dans le domaine : ${manquants.join(', ')}. Un projet STI2D mobilise en général les trois domaines.</div>`;
    }
    $('#synthese-equipe').innerHTML = h;
  };
  editeurListe($('#ed-eleves'), {
    items: projet.eleves, max: maxEleves(), ajouter: 'Ajouter un élève', nouveau: () => nouvelEleve(projet.niveau),
    colonnes: ter ? [
      { k:'nom', label:'Nom de l’élève', ph:'Prénom NOM', largeur:'22%', structurel:true },
      { k:'specialite', label:'Spécialité', type:'select', options:() => SPECIALITES.map(s => [s, s]), largeur:'7.5rem', structurel:true },
      { k:'tache', label:'Tâche', type:'textarea', ph:'Ce dont l’élève est responsable' }
    ] : [
      { k:'nom', label:'Élève', ph:'Prénom NOM', largeur:'22%', structurel:true },
      { k:'tache', label:'Tâche', type:'textarea', ph:'Ce dont l’élève est responsable' },
      { k:'domaine', label:'Domaine', type:'select', options:() => DOMAINES.map(d => [d, d]), largeur:'9.5rem', structurel:true }
    ],
    onChange: () => { modifie(); synthese(); }
  });
  synthese();
}

/* Seconde : simplement le nom de chaque élève et ce qu'il fait */
function ongletEquipeSeconde(c) {

      { k:'nom', label:'Prénom', ph:'Ex. : Emma', largeur:'25%', structurel:true },

    ],

function compterSpecialites() {
  const cpt = {}; SPECIALITES.forEach(s => cpt[s] = 0);
  projet.eleves.forEach(e => { if (cpt[e.specialite] != null) cpt[e.specialite]++; });
  return cpt;
}

/* =====================================================================
   12. DIAGRAMMES SYSML (SVG, mise en page automatique, glisser-déposer)
   ---------------------------------------------------------------------
   Chaque « constructeur » renvoie { noeuds, liens, fond, vide, cadre }.
   Un nœud : { key, forme:'rect'|'ellipse'|'acteur', x, y (centre), w, h, svg (dessin), bb (encombrement) }.
   Les positions déplacées à la souris sont mémorisées dans projet.positions[diagramme][key].
   ===================================================================== */
const LARGEUR_CAR = 6.4;   // largeur moyenne d'un caractère à 12 px (approximation)
const HL = 15;             // hauteur d'une ligne de texte

/* Position d'un nœud : position mémorisée si elle existe, sinon position calculée */
function pos(diag, key, x, y) {
  const m = projet.positions[diag] && projet.positions[diag][key];
  return (m && isFinite(m.x) && isFinite(m.y)) ? { x: m.x, y: m.y } : { x, y };
}

/* Texte multiligne centré (ou aligné à gauche si x0 fourni) */
function texteSVG(lignes, cx, y0, cls = 'dg-t', ancre = 'middle') {
  return lignes.map((l, i) => `<text class="${cls}" x="${cx}" y="${y0 + i * HL}" text-anchor="${ancre}">${esc(l)}</text>`).join('');
}

/* Point d'intersection entre le bord d'un nœud et la droite (centre → cible) */
function bord(n, tx, ty) {
  const dx = tx - n.x, dy = ty - n.y;
  if (!dx && !dy) return { x: n.x, y: n.y };
  if (n.forme === 'ellipse') {
    const a = n.w / 2, b = n.h / 2, t = 1 / Math.sqrt(dx * dx / (a * a) + dy * dy / (b * b));
    return { x: n.x + dx * t, y: n.y + dy * t };
  }
  const t = Math.min((n.w / 2) / Math.abs(dx || 1e-9), (n.h / 2) / Math.abs(dy || 1e-9));
  return { x: n.x + dx * t, y: n.y + dy * t };
}

/* Dessin d'un lien entre deux nœuds A → B (les flèches sont dessinées « à la main »,
   sans <marker>, pour un rendu identique à l'écran et à l'impression) */
function dessinerLien(l, A, B) {
  const p1 = bord(A, B.x, B.y), p2 = bord(B, A.x, A.y);
  const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x), ux = Math.cos(ang), uy = Math.sin(ang);
  const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
  const f = n => n.toFixed(1);
  let s = '';
  if (l.type === 'composition') {
    // Composition (contenance SysML) : cercle avec une croix côté parent (B)
    const r = 7, cx = p2.x - ux * r, cy = p2.y - uy * r;
    s += `<line class="dg-trait" x1="${f(p1.x)}" y1="${f(p1.y)}" x2="${f(cx - ux * r)}" y2="${f(cy - uy * r)}"/>`;
    s += `<circle class="dg-vide" cx="${f(cx)}" cy="${f(cy)}" r="${r}"/><path class="dg-trait" d="M${f(cx - r)} ${f(cy)}H${f(cx + r)}M${f(cx)} ${f(cy - r)}V${f(cy + r)}"/>`;
  } else if (l.type === 'raffinement') {
    // Raffinement : trait pointillé, flèche ouverte côté élément raffiné (B), stéréotype «refine»
    const a = 11, w = 6;
    s += `<line class="dg-trait pointille" x1="${f(p1.x)}" y1="${f(p1.y)}" x2="${f(p2.x)}" y2="${f(p2.y)}"/>`;
    s += `<path class="dg-trait" d="M${f(p2.x - ux * a - uy * w)} ${f(p2.y - uy * a + ux * w)}L${f(p2.x)} ${f(p2.y)}L${f(p2.x - ux * a + uy * w)} ${f(p2.y - uy * a - ux * w)}"/>`;
    s += etiquette('«refine»', mx, my);
  } else {
    s += `<line class="dg-trait" x1="${f(p1.x)}" y1="${f(p1.y)}" x2="${f(p2.x)}" y2="${f(p2.y)}"/>`;
    if (l.label) s += etiquette(l.label, mx, my);
  }
  return s;
}
function etiquette(txt, x, y) {
  const lignes = couper(txt, 24), w = Math.max(...lignes.map(l => l.length)) * 5.9 + 8, h = lignes.length * 13 + 4;
  return `<rect class="dg-etiq" x="${(x - w / 2).toFixed(1)}" y="${(y - h / 2).toFixed(1)}" width="${w.toFixed(1)}" height="${h}" rx="3"/>` +
    lignes.map((l, i) => `<text class="dg-t petit" x="${x.toFixed(1)}" y="${(y - h / 2 + 12 + i * 13).toFixed(1)}" text-anchor="middle">${esc(l)}</text>`).join('');
}

/* ---------- Diagramme d'exigences ----------
   Lecture de gauche à droite : l'exigence mère est à gauche, ses exigences filles
   sont empilées à sa droite, une par ligne. Les liens sont tracés à angles droits
   (trait horizontal, barre verticale, puis un trait horizontal vers chaque fille) :
   ils ne passent jamais sous une case et chaque fille a son propre trait. */
function construireExigences() {
  const ex = projet.exigences, parUid = {}; ex.forEach(e => parUid[e.uid] = e);
  const W = 200, EV = 18, EH = 90;   // largeur des cases, écart vertical entre cases, écart horizontal entre niveaux
  const noeuds = ex.map(e => {
    const corps = [`Id = "${e.id || '?'}"`];
    couper('Texte = « ' + (e.texte || '…') + ' »', 29).forEach(l => corps.push(l));
    if (e.critere) couper('Critère : ' + e.critere, 29).forEach(l => corps.push(l));
    if (e.niveau) couper('Niveau : ' + e.niveau, 29).forEach(l => corps.push(l));
    return { key: e.uid, e, forme: 'rect', w: W, h: 38 + corps.length * HL + 8, corps };
  });
  const parKey = {}; noeuds.forEach(n => parKey[n.key] = n);
  const raffine = k => parKey[k].e.typeRel === 'raffinement';
  // Arborescence : le « parent » d'une exigence est son exigence mère (construite sans boucle)
  const parent = n => { const r = n.e.relation; return r && r !== n.e.uid && parUid[r] ? r : null; };
  const enfants = {}; noeuds.forEach(n => enfants[n.key] = []);
  const vu = new Set();
  const racines = noeuds.filter(n => !parent(n)).map(n => n.key);
  const relier = k => { vu.add(k); noeuds.forEach(n => { if (parent(n) === k && !vu.has(n.key)) { enfants[k].push(n.key); relier(n.key); } }); };
  racines.forEach(relier);
  noeuds.forEach(n => { if (!vu.has(n.key)) { racines.push(n.key); relier(n.key); } });   // exigences prises dans une boucle

  /* 1) Hauteur occupée par chaque sous-arbre */
  const H = {};
  const mesurer = k => {
    const ks = enfants[k];
    const hk = ks.reduce((s, c) => s + mesurer(c), 0) + EV * Math.max(0, ks.length - 1);
    return (H[k] = Math.max(parKey[k].h, hk));
  };
  /* 2) Positions par défaut : la mère est centrée verticalement face à ses filles */
  const defaut = {};
  const placer = (k, x, yTop) => {
    defaut[k] = { x: x + W / 2, y: yTop + H[k] / 2 };
    const ks = enfants[k], hk = ks.reduce((s, c) => s + H[c], 0) + EV * Math.max(0, ks.length - 1);
    let y = yTop + (H[k] - hk) / 2;
    ks.forEach(c => { placer(c, x + W + EH, y); y += H[c] + EV; });
  };
  let yr = 0;
  racines.forEach(k => { mesurer(k); placer(k, 0, yr); yr += H[k] + EV * 2; });

  /* 3) Positions finales (les cases déplacées à la souris gardent leur place) et dessin des cases */
  noeuds.forEach(n => {
    const p = pos('exigences', n.key, defaut[n.key].x, defaut[n.key].y);
    n.x = p.x; n.y = p.y;
    const x0 = n.x - W / 2, y0 = n.y - n.h / 2;
    n.svg = `<rect class="dg-forme" x="${x0}" y="${y0}" width="${W}" height="${n.h}" rx="2"/>
      <rect class="dg-tete" x="${x0}" y="${y0}" width="${W}" height="36" rx="2"/>
      <text class="dg-t petit" x="${n.x}" y="${y0 + 14}" text-anchor="middle">«requirement»</text>
      <text class="dg-t gras" x="${n.x}" y="${y0 + 29}" text-anchor="middle">Exigence ${esc(n.e.id || '')}</text>
      ${texteSVG(n.corps, x0 + 8, y0 + 52, 'dg-t', 'start')}`;
  });

  /* 4) Liens à angles droits */
  const f = v => Math.round(v * 10) / 10;
  const gauche = k => parKey[k].x - W / 2;
  let traits = '';
  Object.keys(enfants).forEach(k => {
    const ks = enfants[k]; if (!ks.length) return;
    const P = parKey[k], xd = P.x + W / 2;                   // bord droit de l'exigence mère
    const comp = ks.filter(c => !raffine(c)), ref = ks.filter(raffine);
    const xMin = Math.min(...ks.map(gauche));
    const xBarre = f(xd + Math.max(22, (xMin - xd) / 2));   // position de la barre verticale
    const deux = comp.length && ref.length;
    // Composition : un seul symbole ⊕ à droite de l'exigence mère, puis une branche par fille
    if (comp.length) {
      const ya = f(P.y - (deux ? 10 : 0)), ys = [ya, ...comp.map(c => parKey[c].y)];
      let d = `M${f(xd + 14)} ${ya}H${xBarre}M${xBarre} ${f(Math.min(...ys))}V${f(Math.max(...ys))}`;
      comp.forEach(c => { d += `M${xBarre} ${f(parKey[c].y)}H${f(gauche(c))}`; });
      traits += `<path class="dg-trait" d="${d}"/>
        <circle class="dg-vide" cx="${f(xd + 7)}" cy="${ya}" r="7"/><path class="dg-trait" d="M${f(xd)} ${ya}H${f(xd + 14)}M${f(xd + 7)} ${f(ya - 7)}V${f(ya + 7)}"/>`;
    }
    // Raffinement : trait pointillé, flèche ouverte vers l'exigence mère, stéréotype «refine»
    if (ref.length) {
      const ya = f(P.y + (deux ? 10 : 0)), xb = f(deux ? xBarre + 12 : xBarre), ys = [ya, ...ref.map(c => parKey[c].y)];
      let d = `M${f(xd)} ${ya}H${xb}M${xb} ${f(Math.min(...ys))}V${f(Math.max(...ys))}`;
      ref.forEach(c => { d += `M${xb} ${f(parKey[c].y)}H${f(gauche(c))}`; });
      traits += `<path class="dg-trait pointille" d="${d}"/>
        <path class="dg-trait" d="M${f(xd + 11)} ${f(ya - 6)}L${f(xd)} ${ya}L${f(xd + 11)} ${f(ya + 6)}"/>` +
        ref.map(c => etiquette('«refine»', gauche(c) - 34, parKey[c].y - 10)).join('');   // étiquette juste avant la case fille
    }
  });
  return { noeuds, liens: [], fond: traits, cadre: 'req [Exigences] ' + (projet.fiche.intitule || 'Système'),
           vide: ex.length ? '' : 'Ajoutez des exigences pour voir le diagramme.' };
}

/* ---------- Diagramme de cas d'utilisation ---------- */
function construireCas() {
  const noeuds = [], liens = [];
  const cas = projet.cas, acteurs = projet.acteurs;
  // Cas d'utilisation (ellipses) disposés en colonne(s) à l'intérieur du cadre du système
  const deuxCol = cas.length > 6, parCol = deuxCol ? Math.ceil(cas.length / 2) : cas.length;
  cas.forEach((c, i) => {
    const lignes = couper(c.nom || '…', 24);
    const w = Math.max(150, Math.min(240, Math.max(...lignes.map(l => l.length)) * LARGEUR_CAR + 50));
    const h = Math.max(54, lignes.length * HL + 28);
    const colonne = deuxCol ? Math.floor(i / parCol) : 0, rang = deuxCol ? i % parCol : i;
    const p = pos('cas', c.uid, deuxCol ? (colonne ? 135 : -135) : 0, rang * 82);
    noeuds.push({ key: c.uid, forme: 'ellipse', x: p.x, y: p.y, w, h, lignes });
  });
  noeuds.forEach(n => {
    n.svg = `<ellipse class="dg-forme" cx="${n.x}" cy="${n.y}" rx="${n.w / 2}" ry="${n.h / 2}"/>${texteSVG(n.lignes, n.x, n.y - (n.lignes.length - 1) * HL / 2 + 4)}`;
  });
  // Cadre du système : englobe toutes les ellipses
  let fond = '', cadreSys = null;
  if (noeuds.length) {
    const x1 = Math.min(...noeuds.map(n => n.x - n.w / 2)) - 30, x2 = Math.max(...noeuds.map(n => n.x + n.w / 2)) + 30;
    const y1 = Math.min(...noeuds.map(n => n.y - n.h / 2)) - 44, y2 = Math.max(...noeuds.map(n => n.y + n.h / 2)) + 24;
    cadreSys = { x1, x2, y1, y2 };
    fond = `<rect class="dg-systeme" x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" rx="6"/>
      <text class="dg-t titre" x="${(x1 + x2) / 2}" y="${y1 + 22}" text-anchor="middle">${esc(projet.fiche.intitule || 'Système')}</text>`;
  }
  // Acteurs (bonhommes) : alternativement à gauche et à droite du cadre,
  // à la hauteur moyenne des cas d'utilisation auxquels ils sont reliés
  const cs = cadreSys || { x1: -100, x2: 100, y1: 0, y2: 0 };
  const cotes = { g: [], d: [] };
  acteurs.forEach((a, i) => cotes[i % 2 ? 'd' : 'g'].push(a));
  Object.entries(cotes).forEach(([cote, liste]) => {
    const pas = Math.max(120, (cs.y2 - cs.y1) / Math.max(1, liste.length));
    liste.forEach((a, i) => {
      const relies = noeuds.filter(n => (cas.find(c => c.uid === n.key)?.acteurs || []).includes(a.uid));
      let yDef = relies.length ? relies.reduce((s, n) => s + n.y, 0) / relies.length : cs.y1 + 60 + i * pas;
      // évite qu'un acteur se superpose au précédent du même côté
      const prec = liste.slice(0, i).map(b => noeuds.find(n => n.key === b.uid)).filter(Boolean);
      prec.forEach(n => { if (Math.abs(n.y - yDef) < 110) yDef = n.y + 110; });
      const p = pos('cas', a.uid, cote === 'g' ? cs.x1 - 110 : cs.x2 + 110, yDef);
      const lignes = couper(a.nom || 'Acteur', 16);
      const n = { key: a.uid, forme: 'acteur', x: p.x, y: p.y, w: 40, h: 66, lignes };
      n.svg = `<rect x="${p.x - 30}" y="${p.y - 40}" width="60" height="${80 + lignes.length * HL}" fill="transparent"/>
        <circle class="dg-forme" cx="${p.x}" cy="${p.y - 27}" r="9"/>
        <path class="dg-trait" style="stroke-width:1.6" d="M${p.x} ${p.y - 18}V${p.y + 6}M${p.x - 16} ${p.y - 9}H${p.x + 16}M${p.x} ${p.y + 6}L${p.x - 13} ${p.y + 28}M${p.x} ${p.y + 6}L${p.x + 13} ${p.y + 28}"/>
        ${texteSVG(lignes, p.x, p.y + 44)}`;
      n.bb = { x1: p.x - 55, x2: p.x + 55, y1: p.y - 40, y2: p.y + 36 + lignes.length * HL };
      noeuds.push(n);
    });
  });
  // Associations acteur — cas d'utilisation
  cas.forEach(c => (c.acteurs || []).forEach(a => { if (acteurs.some(x => x.uid === a)) liens.push({ de: a, a: c.uid, type: 'assoc' }); }));
  return { noeuds, liens, fond, cadre: 'uc [Cas d’utilisation] ' + (projet.fiche.intitule || 'Système'),
           extra: cadreSys, vide: cas.length || acteurs.length ? '' : "Ajoutez des acteurs et des cas d'utilisation pour voir le diagramme." };
}

/* ---------- Diagramme de contexte ---------- */
function construireContexte() {
  const noeuds = [], liens = [];
  const nomSys = projet.fiche.intitule || 'Système';
  const lsys = couper(nomSys, 24);
  const ps = pos('contexte', 'systeme', 0, 0);
  const sys = { key: 'systeme', forme: 'rect', x: ps.x, y: ps.y, w: 210, h: 46 + lsys.length * HL };
  sys.svg = `<rect class="dg-forme" style="stroke-width:2" x="${sys.x - sys.w / 2}" y="${sys.y - sys.h / 2}" width="${sys.w}" height="${sys.h}" rx="3"/>
    <text class="dg-t petit" x="${sys.x}" y="${sys.y - sys.h / 2 + 17}" text-anchor="middle">«block» système étudié</text>
    ${texteSVG(lsys, sys.x, sys.y - sys.h / 2 + 36, 'dg-t gras')}`;
  noeuds.push(sys);
  // Les éléments extérieurs sont regroupés par catégorie puis répartis sur une ellipse autour du système
  const ordre = Object.keys(CATEGORIES_CTX);
  const elems = [...projet.contexte].sort((a, b) => ordre.indexOf(a.categorie) - ordre.indexOf(b.categorie));
  const n = elems.length, rx = Math.max(300, 90 + n * 32), ry = Math.max(190, 60 + n * 22);
  elems.forEach((e, i) => {
    const ang = -Math.PI / 2 + (2 * Math.PI * i) / Math.max(1, n);
    const lignes = couper(e.nom || '…', 20);
    const w = 160, h = 34 + lignes.length * HL;
    const p = pos('contexte', e.uid, Math.round(Math.cos(ang) * rx), Math.round(Math.sin(ang) * ry));
    const cat = CATEGORIES_CTX[e.categorie] ? e.categorie : 'systeme';
    const nd = { key: e.uid, forme: 'rect', x: p.x, y: p.y, w, h };
    nd.svg = `<rect class="dg-forme cat-${cat}" x="${p.x - w / 2}" y="${p.y - h / 2}" width="${w}" height="${h}" rx="8"/>
      <text class="dg-t petit" x="${p.x}" y="${p.y - h / 2 + 15}" text-anchor="middle">«${esc(CATEGORIES_CTX[cat].toLowerCase())}»</text>
      ${texteSVG(lignes, p.x, p.y - h / 2 + 31, 'dg-t gras')}`;
    noeuds.push(nd);
    liens.push({ de: e.uid, a: 'systeme', type: 'lien', label: e.interaction });
  });
  return { noeuds, liens, cadre: 'bdd [Contexte] ' + nomSys, vide: n ? '' : '' };
}

const CONSTRUCTEURS = { exigences: construireExigences, cas: construireCas, contexte: construireContexte };

/* Calcule le contenu SVG complet d'un diagramme : { vb:[x,y,w,h], inner, noeuds } */
function calculerDiagramme(nom) {
  const d = CONSTRUCTEURS[nom]();
  const parKey = {}; d.noeuds.forEach(n => parKey[n.key] = n);
  if (d.vide) return { vb: [0, 0, 520, 160], inner: `<text class="dg-placeholder" x="260" y="85" text-anchor="middle">${esc(d.vide)}</text>`, noeuds: parKey };
  // Encombrement total
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  const etendre = b => { x1 = Math.min(x1, b.x1); y1 = Math.min(y1, b.y1); x2 = Math.max(x2, b.x2); y2 = Math.max(y2, b.y2); };
  d.noeuds.forEach(n => etendre(n.bb || { x1: n.x - n.w / 2, x2: n.x + n.w / 2, y1: n.y - n.h / 2, y2: n.y + n.h / 2 }));
  if (d.extra) etendre(d.extra);
  // Cadre de diagramme SysML (avec son onglet « type [élément] nom »)
  const m = 22; x1 -= m; x2 += m; y1 -= m + 26; y2 += m;
  const titre = d.cadre, wTag = Math.min(x2 - x1 - 10, titre.length * 6.6 + 26);
  let s = `<rect class="dg-cadre" x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}"/>
    <path class="dg-cadre-tag" d="M${x1} ${y1}H${x1 + wTag}V${y1 + 12}L${x1 + wTag - 10} ${y1 + 22}H${x1}Z"/>
    <text class="dg-t gras" x="${x1 + 7}" y="${y1 + 15}">${esc(titre)}</text>`;
  s += d.fond || '';
  s += d.liens.map(l => parKey[l.de] && parKey[l.a] ? dessinerLien(l, parKey[l.de], parKey[l.a]) : '').join('');
  s += d.noeuds.map(n => `<g class="dg-n" data-key="${esc(n.key)}">${n.svg}</g>`).join('');
  const p = 4;
  return { vb: [x1 - p, y1 - p, x2 - x1 + 2 * p, y2 - y1 + 2 * p].map(v => Math.round(v)), inner: s, noeuds: parKey };
}

/* SVG autonome (pour l'aperçu et l'impression) */
function svgDiagramme(nom) {
  const r = calculerDiagramme(nom);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${r.vb.join(' ')}" preserveAspectRatio="xMidYMid meet">${r.inner}</svg>`;
}

/* Affiche un diagramme dans un <svg> de la page et active le glisser-déposer */
function monterDiagramme(svg, nom) {
  const redessiner = (garderVB) => {
    const r = calculerDiagramme(nom);
    if (!garderVB) svg.setAttribute('viewBox', r.vb.join(' '));
    svg.innerHTML = r.inner; svg._noeuds = r.noeuds;
  };
  let glisse = null;
  const point = e => new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  svg.onpointerdown = e => {
    const g = e.target.closest('.dg-n'); if (!g) return;
    const n = svg._noeuds[g.dataset.key]; if (!n) return;
    const p = point(e);
    glisse = { key: n.key, dx: n.x - p.x, dy: n.y - p.y };
    svg.setPointerCapture(e.pointerId); e.preventDefault();
  };
  svg.onpointermove = e => {
    if (!glisse) return;
    const p = point(e);
    projet.positions[nom][glisse.key] = { x: Math.round(p.x + glisse.dx), y: Math.round(p.y + glisse.dy) };
    redessiner(true);
    const g = svg.querySelector(`.dg-n[data-key="${CSS.escape(glisse.key)}"]`); if (g) g.classList.add('glisse');
  };
  const fin = () => { if (!glisse) return; glisse = null; redessiner(false); sauver(); };
  svg.onpointerup = fin; svg.onpointercancel = fin;
  redessiner(false);
  return redessiner;
}

}

/* =====================================================================
   14. PLANNING : tableau des tâches, Gantt, contrôle des heures
   ===================================================================== */
function nomResponsable(r) {
  if (r === 'equipe') return "Toute l'équipe";
  const e = projet.eleves.find(x => x.uid === r);
  return e ? (e.nom || 'Élève ' + (projet.eleves.indexOf(e) + 1)) : '—';
}
function couleurResponsable(r) {
  if (r === 'equipe') return COULEURS[5];
  const i = projet.eleves.findIndex(x => x.uid === r);
  const ELEVES_COULEURS = [0, 1, 2, 3, 4, 6];   // index dans COULEURS (le n° 5, gris, est réservé au groupe)
  return i >= 0 ? COULEURS[ELEVES_COULEURS[i % ELEVES_COULEURS.length]] : '#9aa3ae';
}

/* Bilan des heures : chaque élève dispose de 36 h (Première) ou 72 h (Terminale).
   Une tâche « Toute l'équipe » compte pour chacun des élèves. */
function bilanHeures() {
  const lim = limiteHeures();
  if (projet.niveau === 'seconde') {
    // Seconde : une tâche faite à plusieurs compte pour chacun des élèves qui y participent
    const eleves = projet.eleves.map(e => ({ e, nom: nomResponsable(e.uid),
      h: projet.taches.filter(t => (t.eleves || []).includes(e.uid)).reduce((s, t) => s + nombre(t.duree), 0) }));
    return { lim, equipe: 0, eleves, nonAffecte: projet.taches.filter(t => !(t.eleves || []).some(u => projet.eleves.some(e => e.uid === u))),
             depassements: eleves.filter(x => x.h > lim + 1e-9), total: projet.taches.reduce((s, t) => s + nombre(t.duree), 0) };
  }
  const equipe = projet.taches.filter(t => t.responsable === 'equipe').reduce((s, t) => s + nombre(t.duree), 0);
  const eleves = projet.eleves.map(e => {
    const h = equipe + projet.taches.filter(t => t.responsable === e.uid).reduce((s, t) => s + nombre(t.duree), 0);
    return { e, h, nom: nomResponsable(e.uid) };
  });
  const nonAffecte = projet.taches.filter(t => !t.responsable || (t.responsable !== 'equipe' && !projet.eleves.some(e => e.uid === t.responsable)));
  return { lim, equipe, eleves, nonAffecte, depassements: eleves.filter(x => x.h > lim + 1e-9),
           total: projet.taches.reduce((s, t) => s + nombre(t.duree), 0) };
}

/* Diagramme de Gantt (SVG) : une ligne par tâche, une colonne par semaine */
function svgGantt(pourImpression = false) {
  const hps = Math.max(0.5, nombre(projet.planning.hps) || NIVEAUX[projet.niveau].hps);
  const taches = projet.taches;
  const fin = t => Math.max(1, Math.round(nombre(t.semaine)) || 1) - 1 + nombre(t.duree) / hps;
  const nbSem = Math.max(1, Math.round(nombre(projet.planning.semaines)) || 0, ...taches.map(t => Math.ceil(fin(t) - 1e-9)));
  const LW = 250, CW = Math.max(22, Math.min(44, Math.floor(640 / nbSem))), RH = pourImpression ? 20 : 26, TH = 28;
  const W = LW + nbSem * CW, H = TH + Math.max(1, taches.length) * RH + 6;
  let s = '';
  // Semaine en cours en couleur (à l'écran seulement, pas sur la fiche imprimée)
  const r = pourImpression ? {} : repereDuJour(), wj = r.semaine >= 1 && r.semaine <= nbSem ? r.semaine - 1 : -1;
  if (wj >= 0) s += `<rect class="dg-auj" x="${LW + wj * CW}" y="0" width="${CW}" height="${H}"/><rect class="dg-auj-tete" x="${LW + wj * CW}" y="0" width="${CW}" height="${TH}"/>`;
  for (let i = 0; i < nbSem; i++) {
    const x = LW + i * CW;
    s += `<line class="dg-grille" x1="${x}" y1="0" x2="${x}" y2="${H}"/><text class="dg-t petit${i === wj ? ' dg-auj-txt' : ''}" x="${x + CW / 2}" y="18" text-anchor="middle">S${i + 1}</text>`;
  }
  s += `<line class="dg-trait" x1="0" y1="${TH}" x2="${W}" y2="${TH}"/><line class="dg-trait" x1="${LW}" y1="0" x2="${LW}" y2="${H}"/>`;
  s += `<text class="dg-t gras" x="6" y="18">Tâche (responsable)</text>`;
  if (!taches.length) s += `<text class="dg-placeholder" x="${W / 2}" y="${TH + 18}" text-anchor="middle">Aucune tâche planifiée.</text>`;
  taches.forEach((t, i) => {
    const y = TH + i * RH;
    const enCours = wj >= 0 && r.taches.includes(t);
    if (enCours) s += `<rect class="dg-auj-ligne" x="0" y="${y}" width="${LW}" height="${RH}"/>`;
    else if (i % 2) s += `<rect x="0" y="${y}" width="${W}" height="${RH}" fill="var(--dg-grid)" opacity=".35"/>`;
    const lab = (t.nom || '(sans nom)') + ' — ' + nomResponsable(t.responsable);
    const max = 40;
    s += `<text class="dg-t${enCours ? ' gras' : ''}" x="6" y="${y + RH / 2 + 4}"><title>${esc(lab)}</title>${esc(lab.length > max ? lab.slice(0, max - 1) + '…' : lab)}</text>`;
    const d = nombre(t.duree);
    if (d > 0) {
      const x0 = LW + (Math.max(1, Math.round(nombre(t.semaine)) || 1) - 1) * CW, w = Math.max(3, d / hps * CW);
      s += `<rect x="${x0 + 1}" y="${y + 4}" width="${w - 2}" height="${RH - 8}" rx="4" fill="${couleurResponsable(t.responsable)}"/>`;
      if (w > 30) s += `<text class="dg-t" style="fill:#fff;font-weight:700;font-size:10.5px" x="${x0 + w / 2}" y="${y + RH / 2 + 4}" text-anchor="middle">${esc(fmtH(d))}</text>`;
    }
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" class="gantt" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin meet"${pourImpression ? '' : ` style="max-width:${W * 1.15}px"`}>${s}</svg>`;
}

/* =====================================================================
   REPÈRE DU JOUR : où en est-on aujourd'hui dans le planning ?
   - Seconde : séance du jour (ou prochaine séance) parmi les vendredis datés ;
   - Première / Terminale : semaine du projet, calculée à partir de la date de début.
   ===================================================================== */
const seancesTriees = () => [...projet.seances].sort((a, b) => a.date.localeCompare(b.date));

function repereDuJour() {
  const auj = aujourdhui(), iso = isoDate(auj);
  if (projet.niveau === 'seconde') {
    const S = seancesTriees();
    const k = S.findIndex(x => x.date === iso);
    const kp = k >= 0 ? k : S.findIndex(x => x.date > iso);
    const taches = kp < 0 ? [] : projet.taches.filter(t => { const e = etendueTache(t, S); return nombre(t.duree) > 0 && e.i <= kp && kp <= e.j; });
    return { seconde: true, S, k, kp, taches };
  }
  const debut = lireDate(projet.planning.debut);
  if (!debut) return { semaine: null };
  const w = Math.floor(Math.round((auj - debut) / 86400000) / 7) + 1;
  const hps = Math.max(0.5, nombre(projet.planning.hps) || NIVEAUX[projet.niveau].hps);
  const taches = projet.taches.filter(t => {
    const s0 = Math.max(1, Math.round(nombre(t.semaine)) || 1) - 1, s1 = s0 + nombre(t.duree) / hps;
    return nombre(t.duree) > 0 && s0 <= w - 1 && w - 1 < s1;
  });
  return { semaine: w, debut, taches };
}

/* Bandeau « Aujourd'hui » en haut de l'onglet Planning */
function htmlAujourdhui() {
  const r = repereDuJour(), auj = aujourdhui();
  const jour = auj.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const liste = ts => ts.length ? `<ul>${ts.map(t => `<li><b>${esc(t.nom || '(sans nom)')}</b> — ${esc(r.seconde ? nomEleves(t) : nomResponsable(t.responsable))}${t.outil ? ` · ${esc(t.outil)}` : ''}</li>`).join('')}</ul>` : '<p style="margin:.3rem 0 0">Aucune tâche prévue.</p>';
  if (r.seconde) {
    if (r.k >= 0) return `<div class="alerte info aujourdhui">📅 <b>Aujourd'hui, ${esc(jour)} : séance de ${fmtH(nombre(r.S[r.k].duree))}</b> (n° ${r.k + 1} sur ${r.S.length}). À faire aujourd'hui :${liste(r.taches)}</div>`;
    if (r.kp >= 0) return `<div class="alerte info aujourdhui">📅 Aujourd'hui, ${esc(jour)} : pas de séance. <b>Prochaine séance : ${esc(dateLongue(r.S[r.kp].date))} (${fmtH(nombre(r.S[r.kp].duree))})</b>. Prévu :${liste(r.taches)}</div>`;
    return `<div class="alerte ok aujourdhui">Toutes les séances de l'année sont passées.</div>`;
  }
  if (r.semaine == null) return `<div class="alerte warn aujourdhui">Indiquez la <b>date de début du projet</b> (carte « Tâches du projet ») pour voir la semaine en cours en couleur.</div>`;
  if (r.semaine < 1) return `<div class="alerte info aujourdhui">📅 Le projet commence le ${esc(r.debut.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }))}.</div>`;
  const lundi = new Date(r.debut); lundi.setDate(lundi.getDate() + (r.semaine - 1) * 7);
  return `<div class="alerte info aujourdhui">📅 <b>Aujourd'hui, ${esc(jour)} : semaine ${r.semaine} du projet</b> (à partir du ${esc(lundi.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }))}). Tâches en cours :${liste(r.taches)}</div>`;
}

function htmlBilan(b) {
  let h = '';
  if (b.depassements.length) h += `<div class="alerte danger"><b>⚠ Dépassement d'heures.</b> ${b.depassements.map(x => `${esc(x.nom)} : ${fmtH(x.h)} prévues pour ${b.lim} h disponibles`).join(' · ')}. Réduisez ou répartissez autrement certaines tâches.</div>`;
  else if (projet.taches.length && b.eleves.every(x => Math.abs(x.h - b.lim) < 1e-9)) h += `<div class="alerte ok">✓ Planning complet : chaque élève a exactement ${b.lim} h de travail prévues.</div>`;
  if (b.nonAffecte.length) h += `<div class="alerte warn">${b.nonAffecte.length} tâche${b.nonAffecte.length > 1 ? 's n’ont' : ' n’a'} pas ${projet.niveau === 'seconde' ? 'd’élève' : 'de responsable'}.</div>`;
  if (projet.niveau === 'seconde' && !b.depassements.length) {
    const reste = b.lim - Math.max(0, ...b.eleves.map(x => x.h));
    if (reste > 1e-9) h += `<div class="alerte info">Il reste au moins ${fmtH(reste)} de séances à planifier.</div>`;
  }
  h += `<div class="bilan">` + b.eleves.map(x => {
    const pct = Math.min(100, x.h / b.lim * 100), cls = x.h > b.lim + 1e-9 ? 'trop' : x.h < b.lim - 1e-9 ? 'sous' : '';
    return `<div class="bilan-ligne"><span>${esc(x.nom)}</span><div class="jauge" title="${fmtH(x.h)} / ${b.lim} h"><span class="${cls}" style="width:${pct}%"></span></div><b class="${cls}">${fmtH(x.h)} / ${b.lim} h</b></div>`;
  }).join('') + `</div><p class="aide">${projet.niveau === 'seconde'
    ? `Heures disponibles = total des séances de l'année. Une tâche faite à plusieurs compte pour chaque élève qui y participe.`
    : `Les tâches « Toute l'équipe » (${fmtH(b.equipe)}) comptent pour chaque élève. Total de toutes les tâches : ${fmtH(b.total)}.`}</p>`;
  return h;
}

/* --- Seconde : séances datées (vendredis) et Gantt par séance --- */
function nomEleves(t) {
  const ids = t.eleves || [];
  if (projet.eleves.length && projet.eleves.every(e => ids.includes(e.uid))) return 'Tout le groupe';
  return ids.map(nomResponsable).filter(x => x !== '—').join(', ') || '—';
}
const libelleSeance = x => `${dateLongue(x.date)} (${fmtH(nombre(x.duree))})`;

/* Pour une tâche : première et dernière séance occupées, et fraction utilisée de la dernière */
function etendueTache(t, seances) {
  let i = seances.findIndex(x => x.uid === t.seance); if (i < 0) i = 0;
  let reste = nombre(t.duree), j = i, frac = 1;
  while (reste > 1e-9 && j < seances.length) {
    const d = Math.max(0.25, nombre(seances[j].duree));
    if (reste <= d) { frac = reste / d; reste = 0; break; }
    reste -= d; j++;
  }
  if (j >= seances.length) { j = seances.length - 1; frac = 1; }
  return { i, j, frac, deborde: reste > 1e-9 };
}

function svgGanttSeconde(pourImpression = false) {
  const S = [...projet.seances].sort((a, b) => a.date.localeCompare(b.date)), T = projet.taches;
  const n = Math.max(1, S.length), LW = 250, CW = Math.max(20, Math.min(40, Math.floor(700 / n))), RH = pourImpression ? 20 : 26, TH = 50;
  const W = LW + n * CW, H = TH + Math.max(1, T.length) * RH + 6;
  let s = '';
  // Séance du jour en couleur (ou prochaine séance en pointillés) — à l'écran seulement
  const r = pourImpression ? { k: -1, kp: -1, taches: [] } : repereDuJour();
  if (r.k >= 0) s += `<rect class="dg-auj" x="${LW + r.k * CW}" y="0" width="${CW}" height="${H}"/><rect class="dg-auj-tete" x="${LW + r.k * CW}" y="0" width="${CW}" height="${TH}"/>`;
  else if (r.kp >= 0) s += `<rect class="dg-prochaine" x="${LW + r.kp * CW + 1}" y="1" width="${CW - 2}" height="${H - 2}" rx="3"/>`;
  S.forEach((x, k) => {
    const X = LW + k * CW, c = k === r.k ? ' dg-auj-txt' : '';
    s += `<line class="dg-grille" x1="${X}" y1="0" x2="${X}" y2="${H}"/>
      <text class="dg-t${c}" style="font-weight:700" x="${X + CW / 2}" y="15" text-anchor="middle">${lireDate(x.date) ? lireDate(x.date).getDate() : '?'}</text>
      <text class="dg-t petit${c}" x="${X + CW / 2}" y="28" text-anchor="middle">${lireDate(x.date) ? lireDate(x.date).toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '').slice(0, 4) : ''}</text>
      <text class="dg-t petit${c}" x="${X + CW / 2}" y="43" text-anchor="middle">${String(arrondi(nombre(x.duree))).replace('.', ',')}h</text>`;
  });
  s += `<line class="dg-trait" x1="0" y1="${TH}" x2="${W}" y2="${TH}"/><line class="dg-trait" x1="${LW}" y1="0" x2="${LW}" y2="${H}"/>
    <text class="dg-t gras" x="6" y="20">Tâche (élèves)</text><text class="dg-t petit" x="6" y="38">Séances du vendredi →</text>`;
  if (!T.length) s += `<text class="dg-placeholder" x="${W / 2}" y="${TH + 18}" text-anchor="middle">Aucune tâche planifiée.</text>`;
  T.forEach((t, k) => {
    const y = TH + k * RH;
    const enCours = r.taches.includes(t);
    if (enCours) s += `<rect class="dg-auj-ligne" x="0" y="${y}" width="${LW}" height="${RH}"/>`;
    else if (k % 2) s += `<rect x="0" y="${y}" width="${W}" height="${RH}" fill="var(--dg-grid)" opacity=".35"/>`;
    const lab = (t.nom || '(sans nom)') + ' — ' + nomEleves(t);
    s += `<text class="dg-t${enCours ? ' gras' : ''}" x="6" y="${y + RH / 2 + 4}"><title>${esc(lab)}</title>${esc(lab.length > 40 ? lab.slice(0, 39) + '…' : lab)}</text>`;
    if (nombre(t.duree) > 0 && S.length) {
      const e = etendueTache(t, S), x0 = LW + e.i * CW, w = Math.max(4, (e.j - e.i + e.frac) * CW);
      const ids = t.eleves || [], couleur = ids.length === 1 ? couleurResponsable(ids[0]) : COULEURS[5];
      s += `<rect x="${x0 + 1}" y="${y + 4}" width="${w - 2}" height="${RH - 8}" rx="4" fill="${couleur}"${e.deborde ? ' stroke="#c0262d" stroke-width="2"' : ''}/>`;
      if (w > 30) s += `<text class="dg-t" style="fill:#fff;font-weight:700;font-size:10.5px" x="${x0 + w / 2}" y="${y + RH / 2 + 4}" text-anchor="middle">${esc(fmtH(nombre(t.duree)))}</text>`;
    }
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" class="gantt" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin meet"${pourImpression ? '' : ` style="max-width:${W * 1.15}px"`}>${s}</svg>`;
}

/* Export du planning au format CSV (séparateur « ; », lisible par Excel / LibreOffice) */
function exporterCSV() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  if (projet.niveau === 'seconde') {
    const L = [['Tâche', 'Élèves', 'Logiciel / machine', 'Commence le', 'Durée (h)'].map(q).join(';')];
    projet.taches.forEach(t => { const x = projet.seances.find(z => z.uid === t.seance); L.push([t.nom, nomEleves(t), t.outil, x ? dateCourte(x.date) : '', String(t.duree).replace('.', ',')].map(q).join(';')); });
    return telecharger(`taches-${slug(projet.fiche.intitule)}.csv`, '\ufeff' + L.join('\r\n'), 'text/csv;charset=utf-8');
  }
  const lignes = [['Tâche', 'Responsable', 'Durée (h)', 'Semaine de début'].map(q).join(';')];
  projet.taches.forEach(t => lignes.push([t.nom, nomResponsable(t.responsable), String(t.duree).replace('.', ','), t.semaine].map(q).join(';')));
  telecharger(`taches-${slug(projet.fiche.intitule)}.csv`, '﻿' + lignes.join('\r\n'), 'text/csv;charset=utf-8');
}

/* =====================================================================
   14 bis. ONGLET « COURSE EN COURS » (règlement officiel 2026-2027)
   ---------------------------------------------------------------------
   - Première / Terminale : contrôle technique du véhicule et du stand,
     équipe et rôles, livrables, budget (2 000 € max), épreuves et
     auto-évaluation des 19 critères, calendrier avec compte à rebours.
   - Seconde : découverte du vrai concours et comparaison avec la mini version.
   ===================================================================== */
/* Vérifie une mesure par rapport au règlement : '' (non saisie), 'ok' ou 'ko' */
function etatMesure(d, v) {
  if (v === '' || v == null || isNaN(nombre(v))) return { etat: '', txt: '' };
  const x = nombre(v);
  if (d.min != null && x < d.min) return { etat: 'ko', txt: `⚠ Minimum ${d.min} ${d.unite}` };
  if (d.max != null && x > d.max) return { etat: 'ko', txt: `⚠ Maximum ${d.max} ${d.unite}` };
  return { etat: 'ok', txt: '✓ Conforme' };
}
const limiteTexte = d => d.min != null && d.max != null ? `entre ${d.min} et ${d.max} ${d.unite}` : d.max != null ? `${d.max} ${d.unite} maximum` : `${d.min} ${d.unite} minimum`;

/* Bilan de conformité (véhicule ou stand) : nombre de points conformes / total */
function bilanConformite(mesures, coches) {
  const C = projet.cec;
  const etats = mesures.map(d => etatMesure(d, C.mesures[d.k]).etat);
  const ok = etats.filter(e => e === 'ok').length + coches.filter(([k]) => C.coches[k]).length;
  const ko = etats.filter(e => e === 'ko').length;
  const total = mesures.length + coches.length;
  return { ok, ko, total, conforme: ok === total && ko === 0 };
}

const bilanBudget = () => {
  const r = projet.cec.budget.reduce((s, x) => s + nombre(x.recette), 0), d = projet.cec.budget.reduce((s, x) => s + nombre(x.depense), 0);
  return { recettes: r, depenses: d, solde: r - d };
};
const euros = n => (Math.round(n * 100) / 100).toLocaleString('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' €';

/* Échéances du calendrier (dates officielles + dates fixées par le Centre de Ressources) */
function echeancesCec() {
  const D = projet.cec.dates, l = [
    { k:'inscriptions', label:'Inscriptions sur ADAGE (via le professeur)', debut:'2026-09-01', date:'2026-10-31', fixe:true },
    { k:'preselection', label:'Pré-sélection (si organisée)', date:D.preselection },
    { k:'autorisations', label:'Envoi des autorisations de prise de vue au Centre de Ressources', date:'', calc:true },
    { k:'finaleAcad', label:'Finale académique / régionale', date:D.finaleAcad },
    { k:'finaleNat', label:'Finale nationale (fin mai ou tout début juin 2027)', date:D.finaleNat }
  ];
  const fa = lireDate(D.finaleAcad);
  if (fa) { const a = new Date(fa); a.setDate(a.getDate() - 7); l[2].date = isoDate(a); }
  const auj = isoDate(aujourdhui());
  const prochaine = l.filter(e => e.date && e.date >= auj).sort((a, b) => a.date.localeCompare(b.date))[0];
  l.forEach(e => { e.passee = e.date && e.date < auj; e.prochaine = e === prochaine; });
  return l;
}
const joursAvant = iso => Math.round((lireDate(iso) - aujourdhui()) / 86400000);
